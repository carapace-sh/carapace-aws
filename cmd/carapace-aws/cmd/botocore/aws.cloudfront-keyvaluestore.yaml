# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: cloudfront-keyvaluestore
description: Amazon CloudFront KeyValueStore
commands:
    - name: delete-key
      description: Deletes the key-value pair specified by the key.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --if-match=!: The current version (`ETag`) of the key value store that you are deleting keys from, which you can get by using the `DescribeKeyValueStore` API operation.
        --key=!: The key to delete.
        --kvs-arn=!: The Amazon Resource Name (ARN) of the key value store.
    - name: describe-key-value-store
      description: Returns metadata information about the key value store.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --kvs-arn=!: The Amazon Resource Name (ARN) of the key value store.
    - name: get-key
      description: Returns a key-value pair.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --key=!: The key to get.
        --kvs-arn=!: The Amazon Resource Name (ARN) of the key value store.
    - name: list-keys
      description: Returns a list of key-value pairs.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --kvs-arn=!: The Amazon Resource Name (ARN) of the key value store.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Maximum number of results that are returned per call.
        --next-token=: If `nextToken` is returned in the response, there are more results available.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: put-key
      description: Creates a new key-value pair or replaces the value of an existing key.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --if-match=!: The current version (`ETag`) of the key value store that you are putting keys into, which you can get by using the `DescribeKeyValueStore` API operation.
        --key=!: The key to put.
        --kvs-arn=!: The Amazon Resource Name (ARN) of the key value store.
        --value=!: The value to put.
    - name: update-keys
      description: Puts or deletes multiple key-value pairs in a single, all-or-nothing operation.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --deletes=:
            description: List of keys to delete.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --if-match=!: The current version (`ETag`) of the key value store that you are updating keys of, which you can get by using the `DescribeKeyValueStore` API operation.
        --kvs-arn=!: The Amazon Resource Name (ARN) of the key value store.
        --puts=:
            description: List of key-value pairs to put.
            nargs: -1
