# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: abuse-signal
description: AWS Abuse Signal API
commands:
    - name: create-abuse-report
      description: Submits a structured report.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: An optional, client-provided idempotency token that ensures the operation completes no more than once.
        --correlation-id=: An optional correlation ID for tracking the report in the reporter's system.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --report=!: The abuse report data in XARF format.
    - name: get-abuse-report-status
      description: Retrieves the current processing status of a previously submitted abuse report, including the status, submission timestamp, and last-update time.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --report-id=!: The unique identifier of the abuse report to retrieve status for.
    - name: list-abuse-report-statuses
      description: Lists abuse report statuses for the calling account, ordered by submission time, with optional filtering and pagination.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --correlation-id=: Filters results by the reporter-provided correlation ID.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return in a single page.
        --next-token=: The pagination token for retrieving the next page of results.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: wait
      description: Wait  until  a particular condition is satisfied.
      commands:
        - name: report-processing
          description: Retrieves the current processing status of a previously submitted abuse report, including the status, submission timestamp, and last-update time.
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
            --report-id=!: The unique identifier of the abuse report to retrieve status for.
