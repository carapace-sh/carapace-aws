# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: sagemakertrainingsessionruntime
description: SageMaker Training Session Runtime
commands:
    - name: execute-sampling-operation
      description: Submits an asynchronous sampling operation to generate text or compute log-probabilities from the model associated with the specified training session.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --operation-config=!: The configuration for the sample operation.
        --training-session-name=!: The name of the training session to sample from.
    - name: execute-training-operation
      description: Submits an asynchronous training operation to the specified training session.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure that the operation completes no more than one time.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --operation-config=!: The configuration that specifies the type and parameters of the training operation.
        --sequence-number=!: The monotonically increasing sequence number that determines execution order.
        --training-session-name=!: The name of the training session to submit the operation to.
    - name: get-sampling-operation-result
      description: Retrieves the current status and result of a previously submitted sampling operation.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --operation-id=!: The unique identifier of the sample operation to retrieve, returned by `ExecuteSamplingOperation`.
        --training-session-name=!: The name of the training session that owns the sample operation.
    - name: get-training-operation-result
      description: Retrieves the current status and result of a previously submitted training operation.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --operation-id=!: The unique identifier of the operation to retrieve, returned by `ExecuteTrainingOperation`.
        --training-session-name=!: The name of the training session that owns the operation.
    - name: sample-training-session
      description: Sends an inference request to the model associated with the specified training session and returns the response synchronously.
      flags:
        --accept=: The desired MIME type of the inference body in the response.
        --body=: The raw inference request body.
        --content-type=: The MIME type of the input data in the request body.
        --model-package-arn=: The ARN of the model package whose checkpoint to invoke.
        --training-session-name=!: The name of the training session whose model to invoke.
      completion:
        positional:
            - - $files
    - name: sample-training-session-with-response-stream
      description: Streams inference responses from the model associated with the specified training session.
      flags:
        --accept=: The desired MIME type of the inference body in the response.
        --body=: The raw inference request body.
        --content-type=: The MIME type of the input data in the request body.
        --model-package-arn=: The ARN of the model package whose checkpoint to invoke.
        --training-session-name=!: The name of the training session whose model to invoke.
      completion:
        positional:
            - - $files
