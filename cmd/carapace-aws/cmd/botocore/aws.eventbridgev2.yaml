# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: eventbridgev2
description: Amazon EventBridgeV2
commands:
    - name: create-event-bus
      description: Creates an event bus.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Unique, case-sensitive identifier that ensures the idempotency of the request.
        --description=: Free-text description.
        --encryption-configuration=: Encryption configuration for an event bus.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: Name of an event bus.
        --storage-configuration=: Event storage configuration for an event bus.
        --tags=: Tags attached to a resource, as key-value pairs.
    - name: create-event-source
      description: Creates an EventSource, which forwards events from an origin (an AWS service, a partner, or a third-party webhook provider) to an event bus.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Unique, case-sensitive identifier that ensures the idempotency of the request.
        --configuration=!: Discriminated EventSource configuration.
        --description=: Free-text description.
        --event-bus-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: EventSource name.
        --tags=: Tags attached to a resource, as key-value pairs.
    - name: create-subscriber
      description: Creates a subscriber on an event bus, which delivers matching events to the configured target.
      flags:
        --batch-configuration=: Batching configuration for a subscriber.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Unique, case-sensitive identifier that ensures the idempotency of the request.
        --description=: Free-text description.
        --event-bus-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
        --filter-configuration=: Configuration for filtering events delivered to a subscriber.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --invoke-configuration=!: Configuration for how the subscriber invokes its target.
        --log-configuration=: Log configuration for a subscriber.
        --name=!: Name of a subscriber.
        --on-failure-configuration=: 'On-failure configuration: where a failed delivery is sent.'
        --point-in-time-configuration=: Point-in-time configuration for a subscriber.
        --retry-policy=: Retry policy for a subscriber.
        --starting-position=: Starting position for a subscriber.
        --state=: Customer-controlled run state of a subscriber, set on create or update.
        --tags=: Tags attached to a resource, as key-value pairs.
        --transformer=: Transformer configuration for a subscriber.
        --type=: 'Delivery ordering mode of a subscriber: FIFO delivers events in order within an event group; UNORDERED delivers without an ordering guarantee.'
      completion:
        flag:
            starting-position:
                - LATEST
                - POINT_IN_TIME
            state:
                - RUNNING
                - STOPPED
            type:
                - FIFO
                - UNORDERED
    - name: delete-event-bus
      description: Deletes an event bus.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-bus-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-event-source
      description: Deletes an EventSource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-source-arn=!: 'EventSource ARN: event-sourcev2/&lt;type&gt;/&lt;name&gt;/&lt;id&gt;.'
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-resource-policy
      description: Deletes the named resource policy attached to an event bus.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --expected-revision-id=: The delete succeeds only if the named policy's current revision ID matches this value; if it differs or the policy does not exist, the operation fails with ConflictException.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --policy-name=: Which named policy to delete.
        --resource-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
    - name: delete-subscriber
      description: Deletes a subscriber.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --subscriber-arn=!: The Amazon Resource Name (ARN) that uniquely identifies a subscriber.
    - name: describe-event-bus
      description: Returns the full configuration and lifecycle state of an event bus.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-bus-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: describe-event-source
      description: Returns the full configuration and lifecycle state of an EventSource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-source-arn=!: 'EventSource ARN: event-sourcev2/&lt;type&gt;/&lt;name&gt;/&lt;id&gt;.'
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: describe-subscriber
      description: Returns the full configuration and state of a subscriber.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --subscriber-arn=!: The Amazon Resource Name (ARN) that uniquely identifies a subscriber.
    - name: get-resource-policy
      description: Returns the named resource policy attached to an event bus.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --policy-name=: Which named policy to read.
        --resource-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
    - name: list-event-buses
      description: 'Lists the event buses visible to the caller: buses the account owns and buses shared with it through AWS RAM.'
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-bus-account-id=: AWS Account Id.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Maximum number of results to return in one page of a List operation.
        --name-prefix=: Name of an event bus.
        --next-token=: Opaque pagination token returned by a List operation.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-event-sources
      description: Lists EventSources as summaries.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-bus-arn=: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Maximum number of results to return in one page of a List operation.
        --name-prefix=: EventSource name.
        --next-token=: Opaque pagination token returned by a List operation.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-resource-policies
      description: Lists the resource policies attached to an event bus as summaries (policy name and revision ID).
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Maximum number of results to return in one page of a List operation.
        --next-token=: Opaque pagination token returned by a List operation.
        --page-size=: The size of each page to get in the AWS service call.
        --resource-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
        --starting-token=: A token to specify where to start paginating.
    - name: list-subscribers
      description: Lists subscribers as summaries.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-bus-arn=: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Maximum number of results to return in one page of a List operation.
        --name-prefix=: Name of a subscriber.
        --next-token=: Opaque pagination token returned by a List operation.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-tags-for-resource
      description: Lists the tags on an event bus, subscriber, or event source.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: 'ARN for an EventBridge resource that supports tagging: event buses, subscribers, and event sources.'
    - name: put-events
      description: Publishes events to an event bus.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --deduplication-configuration=: Request-level deduplication settings, applied to every entry in the batch.
        --entries=!:
            description: List of event entries to publish.
            nargs: -1
        --event-bus-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: put-raw-events
      description: Publishes pre-shaped events to an event bus.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --deduplication-configuration=: Request-level deduplication settings, applied to every entry in the batch.
        --entries=!:
            description: List of event entries to publish.
            nargs: -1
        --event-bus-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --schema-registry-configuration=: Schema-registry settings for encoding open-format (Avro/Protobuf) events.
    - name: put-resource-policy
      description: Attaches a named resource policy to an event bus — the only resource type that supports policies; other resource ARNs are rejected.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --expected-revision-id=: The write succeeds only if the named policy's current revision ID matches this value; a policy that does not exist yet matches only the sentinel "NO\_POLICY" (create-only).
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --policy-document=!: A resource policy document, as a JSON string.
        --policy-name=: Which named policy to write.
        --resource-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
    - name: revoke-resource
      description: Revokes a subscriber or an EventSource.
      flags:
        --arn=!: 'ARN of a resource a bus owner can revoke: a subscriber or an EventSource.'
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: rotate-webhook-credentials
      description: Sets a new credential on a webhook EventSource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Unique, case-sensitive identifier that ensures the idempotency of the request.
        --credential=: The new credential.
        --event-source-arn=!: The ARN of the webhook EventSource.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: tag-resource
      description: Adds or replaces tags on an event bus, subscriber, or event source.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: 'ARN for an EventBridge resource that supports tagging: event buses, subscribers, and event sources.'
        --tags=!: Tags attached to a resource, as key-value pairs.
    - name: untag-resource
      description: Removes tags from an event bus, subscriber, or event source.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: 'ARN for an EventBridge resource that supports tagging: event buses, subscribers, and event sources.'
        --tag-keys=!:
            description: List of tag keys.
            nargs: -1
    - name: update-event-bus
      description: Updates an event bus.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: Free-text description.
        --encryption-configuration=: Encryption configuration for an event bus.
        --event-bus-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --storage-configuration=: Event storage configuration for an event bus.
    - name: update-event-source
      description: Updates an EventSource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --configuration=: Discriminated EventSource configuration.
        --description=: Free-text description.
        --event-source-arn=!: 'EventSource ARN: event-sourcev2/&lt;type&gt;/&lt;name&gt;/&lt;id&gt;.'
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: update-subscriber
      description: Updates a subscriber.
      flags:
        --batch-configuration=: Batching configuration for a subscriber.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: Free-text description.
        --filter-configuration=: Configuration for filtering events delivered to a subscriber.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --invoke-configuration=: Update-able configuration for how the subscriber invokes its target.
        --log-configuration=: Log configuration for a subscriber.
        --on-failure-configuration=: 'On-failure configuration: where a failed delivery is sent.'
        --resume-position=: Position from which delivery resumes when a subscriber is unpaused.
        --retry-policy=: Retry policy for a subscriber.
        --state=: Customer-controlled run state of a subscriber, set on create or update.
        --subscriber-arn=!: The Amazon Resource Name (ARN) that uniquely identifies a subscriber.
        --transformer=: Transformer configuration for a subscriber.
      completion:
        flag:
            resume-position:
                - LAST_PROCESSED
                - LATEST
            state:
                - RUNNING
                - STOPPED
    - name: wait
      description: Wait  until  a particular condition is satisfied.
      commands:
        - name: event-bus-active
          description: Returns the full configuration and lifecycle state of an event bus.
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --event-bus-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        - name: event-bus-deleted
          description: Returns the full configuration and lifecycle state of an event bus.
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --event-bus-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an event bus.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        - name: msk-subscriber-active
          description: Returns the full configuration and state of a subscriber.
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
            --subscriber-arn=!: The Amazon Resource Name (ARN) that uniquely identifies a subscriber.
