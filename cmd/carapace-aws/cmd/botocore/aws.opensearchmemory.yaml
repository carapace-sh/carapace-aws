# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: opensearchmemory
description: Amazon OpenSearch Memory
commands:
    - name: batch-get-event
      description: Gets up to 10 events by ID, each as `GetEvent` returns it, including its payload.
      flags:
        --actor-id=: The actor that every requested event must belong to.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-ids=!:
            description: 'The IDs of the events to get: 1 to 10, without duplicates.'
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --session-id=: The session that every requested event must belong to.
        --space-id=!: The ID of the space.
    - name: create-event
      description: Submits an event (conversation turns, structured data, or a PDF document stored in Amazon S3) to a session in a space.
      flags:
        --actor-id=!: The ID of the actor (end user or agent) that the event belongs to.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that makes the request idempotent.
        --event-timestamp=: When the event occurred.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --infer: Specifies whether to extract memories from this event.
        --metadata=: Metadata tags to store with the event.
        --no-infer: Specifies whether to extract memories from this event.
        --payload=!: The event content.
        --session-id=: The session the event belongs to.
        --space-id=!: The ID of the space that owns the event, for example `sp-02864597b164`.
    - name: create-memory
      description: Writes a memory that you have already formed, without extracting it from events.
      flags:
        --actor-id=!: The actor (end user or agent) that owns the memory.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that makes the request idempotent.
        --content=!: The memory text, stored and embedded as provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --metadata=: Metadata tags to store with the memory.
        --name=!: The name of the strategy that the memory belongs to.
        --session-id=: The session that the memory belongs to.
        --space-id=!: The ID of the space that owns the memory, for example `sp-02864597b164`.
    - name: create-space
      description: Creates a space.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that makes the request idempotent.
        --encryption-configuration=: The AWS KMS key that encrypts the space's data.
        --event-expiry-days=: How many days the space keeps each event, from 1 to 365. The default is 90.
        --extraction-model-id=: 'The model that extracts and consolidates memories for every strategy in the space, as an Amazon Bedrock model ID without an inference-profile prefix: `anthropic.claude-opus-5-5` or `anthropic.claude-haiku-5-5`.'
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --memory-expiry-days=: How many days the space keeps each memory, from 0 to 3650, counted from when the service writes the memory.
        --memory-strategies=:
            description: 'The memory strategies that extract memories from the space''s events: up to 10 strategies, each with a name that is unique within the space.'
            nargs: -1
        --name=!: A name for the space, unique within your account in the Region.
        --tags=:
            description: The tags to add to the space.
            nargs: -1
    - name: delete-event
      description: Deletes an event.
      flags:
        --actor-id=: The actor that the event must belong to.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-id=!: The ID of the event to delete.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --session-id=: The session that the event must belong to.
        --space-id=!: The ID of the space.
    - name: delete-memory
      description: Deletes a memory, including its content and embedding.
      flags:
        --actor-id=: The ID of the actor that the memory must belong to.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --memory-id=!: The ID of the memory to delete.
        --space-id=!: The ID of the space that owns the memory.
        --strategy-name=: The name of the strategy that the memory must belong to.
    - name: delete-space
      description: Deletes a space and its memories.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --space-id=!: The ID of the space to delete.
    - name: get-event
      description: Gets an event by ID, including its payload.
      flags:
        --actor-id=: The actor the event must belong to.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-id=!: The event's ID, as returned by `CreateEvent`, `ListEvents`, or `SearchEvents`.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --session-id=: The session the event must belong to.
        --space-id=!: The ID of the space.
    - name: get-memory
      description: Gets a memory by ID, as returned by `SearchMemories` or `ListMemories`.
      flags:
        --actor-id=: The ID of the actor the memory must belong to.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --memory-id=!: The memory's ID, as returned by `SearchMemories` or `ListMemories`.
        --space-id=!: The ID of the space that holds the memory.
        --strategy-name=: The name of the strategy the memory must belong to.
    - name: get-space
      description: Returns a space's configuration and status.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --space-id=!: The ID of the space.
    - name: list-events
      description: Lists the events in a session, sorted by time.
      flags:
        --actor-id=!: The actor whose events to list.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-timestamp-after=: 'Inclusive lower bound on `eventTimestamp`: only events at or after this time are returned.'
        --event-timestamp-before=: 'Inclusive upper bound on `eventTimestamp`: only events at or before this time are returned.'
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of events to return, from 1 to 100. The default is 20.
        --metadata-filters=: Returns only events whose metadata contains every one of these key-value pairs.
        --next-token=: The token for the next set of results.
        --page-size=: The size of each page to get in the AWS service call.
        --session-id=!: The session whose events to list.
        --sort-order=: 'The order of the results by `eventTimestamp`: `ASC` or `DESC`.'
        --space-id=!: The ID of the space.
        --starting-token=: A token to specify where to start paginating.
      completion:
        flag:
            sort-order:
                - ASC
                - DESC
    - name: list-memories
      description: Lists a space's memories without a query, for example the most recent memories or the memories of one strategy.
      flags:
        --actor-ids=:
            description: Lists only memories owned by one of these actors.
            nargs: -1
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of memories to return, from 1 to 100. The default is 20.
        --memory-strategies=:
            description: The strategies to list, as selectors.
            nargs: -1
        --next-token=: The token for the next set of results.
        --page-size=: The size of each page to get in the AWS service call.
        --session-ids=:
            description: Lists only memories from one of these sessions.
            nargs: -1
        --sort-by=: 'The timestamp to sort by, as returned in `systemMetadata`: `CREATED_AT` (the default) or `UPDATED_AT`.'
        --sort-order=: 'The sort order: `ASC` or `DESC`.'
        --space-id=!: The space whose memories to list.
        --starting-token=: A token to specify where to start paginating.
      completion:
        flag:
            sort-by:
                - CREATED_AT
                - UPDATED_AT
            sort-order:
                - ASC
                - DESC
    - name: list-spaces
      description: Lists the spaces in your account in the current Region.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of spaces to return, from 1 to 100. The default is 100.
        --next-token=: The token for the next set of results.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-tags-for-resource
      description: Lists the tags for the specified space.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The Amazon Resource Name (ARN) of the space.
    - name: search-events
      description: Searches a space's events by relevance.
      flags:
        --actor-id=!: The actor whose events to search (exact match).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of events to return, from 1 to 100. The default is 20.
        --next-token=: The token for the next set of results.
        --page-size=: The size of each page to get in the AWS service call.
        --query=!: 'The query: a subset of the OpenSearch Query DSL (see `SearchQuery`), validated by the same rules as on `SearchMemories`.'
        --session-ids=:
            description: Returns only events from one of these sessions (exact match).
            nargs: -1
        --sort=: The sort order (see `SearchSort`).
        --space-id=!: The space whose events to search.
        --starting-token=: A token to specify where to start paginating.
    - name: search-memories
      description: Searches a space's memories by relevance.
      flags:
        --actor-id=!: The actor whose memories to search (exact match).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of memories to return, from 1 to 100. The default is 20.
        --memory-strategies=:
            description: The strategies to search, as a list of selectors.
            nargs: -1
        --next-token=: The token for the next set of results.
        --page-size=: The size of each page to get in the AWS service call.
        --query=!: 'The query: a subset of the OpenSearch Query DSL (see `SearchQuery`).'
        --sort=: The sort order (see `SearchSort`).
        --space-id=!: The space to search.
        --starting-token=: A token to specify where to start paginating.
    - name: tag-resource
      description: Adds the specified tags to the specified space.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The Amazon Resource Name (ARN) of the space.
        --tags=!:
            description: The tags to add to the space.
            nargs: -1
    - name: untag-resource
      description: Removes the specified tags from the specified space.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The Amazon Resource Name (ARN) of the space.
        --tag-keys=!:
            description: The keys of the tags to remove from the space.
            nargs: -1
    - name: update-memory
      description: Updates a memory in place.
      flags:
        --actor-id=: The ID of the actor that the memory must belong to.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --content=: Replacement memory text.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --memory-id=!: The ID of the memory to update.
        --metadata-mode=: How `metadata` combines with what is stored.
        --metadata=: The metadata tags to apply.
        --space-id=!: The ID of the space that owns the memory, for example `sp-02864597b164`.
        --strategy-name=: The name of the strategy that the memory must belong to.
      completion:
        flag:
            metadata-mode:
                - REPLACE
                - MERGE
    - name: update-space
      description: Updates a space's memory strategies, retention settings, or extraction model.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --event-expiry-days=: How many days the space keeps each event, from 1 to 365. Omit it to leave the current value unchanged.
        --extraction-model-id=: 'The model that extracts and consolidates memories for every strategy in the space: `anthropic.claude-opus-5-5` or `anthropic.claude-haiku-5-5`.'
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --memory-expiry-days=: How many days the space keeps each memory, from 0 to 3650. 0 means memories never expire.
        --memory-strategies=:
            description: The complete new list of memory strategies.
            nargs: -1
        --space-id=!: The ID of the space to update.
    - name: wait
      description: Wait  until  a particular condition is satisfied.
      commands:
        - name: space-active
          description: Returns a space's configuration and status.
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
            --space-id=!: The ID of the space.
        - name: space-deleted
          description: Returns a space's configuration and status.
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
            --space-id=!: The ID of the space.
