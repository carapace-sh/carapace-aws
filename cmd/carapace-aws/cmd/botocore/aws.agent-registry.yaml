# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: agent-registry
description: Agent Registry
commands:
    - name: batch-get-discoverable-registry-record
      description: Retrieves multiple discoverable registry records by ID from a single registry.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --entries=!:
            description: The registry-scoped groups of record IDs to retrieve.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: list-discoverable-registry-records
      description: Lists the discoverable registry records in a registry.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --filters=:
            description: The filters to apply to the discoverable registry record list.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of records to return in a single page.
        --next-token=: The pagination token returned by a previous request.
        --page-size=: The size of each page to get in the AWS service call.
        --registry-id=!: The identifier of the registry whose discoverable records are listed.
        --starting-token=: A token to specify where to start paginating.
    - name: search-discoverable-registry-records
      description: Searches the discoverable registry records in a registry using a natural language query.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --filters=: An optional structured JSON metadata filter that narrows the search results.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-results=: The maximum number of results to return.
        --registry-ids=!:
            description: The registry identifiers to search within.
            nargs: -1
        --search-query=!: The natural language query to search for matching registry records.
