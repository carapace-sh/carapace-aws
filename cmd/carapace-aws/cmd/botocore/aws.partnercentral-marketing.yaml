# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: partnercentral-marketing
description: Partner Central Marketing API
commands:
    - name: batch-create-campaign-asset
      description: Instantiates one or more of the campaign template's blueprints as assets of this campaign.
      flags:
        --campaign-identifier=!: The campaign identifier.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --entries=!:
            description: The blueprints to instantiate, one entry each.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: create-campaign
      description: Creates a new marketing campaign.
      flags:
        --campaign-template-id=!: The campaign template this campaign draws its assets from.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Idempotency token.
        --email-target-engagement-group-ids=:
            description: 'Engagement groups whose contacts the campaign''s emails will also go to: the `Id`s `ListEngagementGroups` returns (AWS Partner Central Selling).'
            nargs: -1
        --email-target=: The campaign's send audience — a CSV of recipient email addresses.
        --end-on=: The last day of the campaign's run window, inclusive and in UTC.
        --estimated-budget=: What the partner expects the campaign to cost.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The display name.
        --partner-address=: The partner's physical postal address, shown in every email footer and as a landing page's contact line.
        --partner-badge=: The partner's badge — a tier or designation badge from AWS Partner Badge Manager — shown in every badge slot of the campaign's emails, landing pages and documents.
        --privacy-policy-url=: The URL of the partner's privacy policy, linked from every email and landing page footer.
        --sender-email=: The address every email of this campaign is sent from.
        --start-on=: The first day of the campaign's run window.
        --tags=:
            description: Tags to apply at creation.
            nargs: -1
        --target-audience=: Advisory targeting metadata.
        --total-budget=: The campaign's total budget.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: create-social-connection-authorization-url
      description: Creates a single-use URL the partner visits to authorize publishing on a platform.
      flags:
        --catalog=!: Catalog the connection belongs to.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --platform=!: Social platform to authorize.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
            platform:
                - FACEBOOK
                - LINKEDIN
                - X
    - name: deactivate-campaign-asset
      description: 'Stops a live campaign asset: an email''s scheduled send is withdrawn, a social post is removed before it publishes.'
      flags:
        --campaign-asset-identifier=!: The asset identifier.
        --campaign-identifier=!: The campaign identifier.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: delete-campaign
      description: Permanently deletes a campaign, its assets and their stored files.
      flags:
        --campaign-identifier=!: The campaign to delete.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: delete-campaign-asset
      description: Permanently deletes a campaign asset.
      flags:
        --campaign-asset-identifier=!: The asset identifier.
        --campaign-identifier=!: The campaign identifier.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: delete-social-connection
      description: Revokes and deletes one social connection; other connections on the same platform are untouched.
      flags:
        --catalog=!: Catalog the connection belongs to.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Idempotency token.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --identifier=!: Identifier or ARN of the social connection to delete.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: get-campaign
      description: Retrieves a campaign by its identifier.
      flags:
        --campaign-identifier=!: The campaign identifier.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: get-campaign-asset
      description: Retrieves an asset by its identifier.
      flags:
        --campaign-asset-identifier=!: The asset identifier.
        --campaign-identifier=!: The campaign identifier.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: get-campaign-asset-activation-task
      description: Reads a campaign's current activation task.
      flags:
        --campaign-identifier=!: The campaign whose current task to read.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: get-campaign-asset-export-task
      description: Retrieves a campaign asset export task by its identifier, reporting its status and, when the task is COMPLETED, a freshly minted short-lived presigned URL for downloading the ZIP archive.
      flags:
        --campaign-asset-export-task-identifier=!: 'The export task to retrieve: the `Id` StartCampaignAssetExportTask returned (`etsk-…`).'
        --campaign-identifier=!: The campaign that owns the export task.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: get-campaign-template
      description: Retrieves full detail of one campaign template, including its ordered asset templates with their field schema and layout previews.
      flags:
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --identifier=!: The campaign template's id.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: list-campaign-assets
      description: Lists assets for a campaign with pagination.
      flags:
        --campaign-identifier=!: The campaign identifier.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Maximum results per page.
        --next-token=: Pagination token.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: list-campaigns
      description: Lists campaigns with optional filters and pagination.
      flags:
        --campaign-identifiers=:
            description: Only these campaigns, each named by its id or its campaign ARN.
            nargs: -1
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Maximum results per page.
        --name=: Only campaigns whose name contains this, compared case-insensitively.
        --next-token=: Pagination token.
        --page-size=: The size of each page to get in the AWS service call.
        --sort=: The order of the results.
        --starting-token=: A token to specify where to start paginating.
        --states=:
            description: Only campaigns in one of these states.
            nargs: -1
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: list-social-connections
      description: Lists the partner's social connections, optionally filtered by platform.
      flags:
        --catalog=!: Catalog to list connections from.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Maximum number of results to return per page.
        --next-token=: Pagination token from a previous response.
        --page-size=: The size of each page to get in the AWS service call.
        --platform=: Restrict results to a single social platform.
        --starting-token=: A token to specify where to start paginating.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
            platform:
                - FACEBOOK
                - LINKEDIN
                - X
    - name: list-tags-for-resource
      description: Lists the tags applied to a Partner Central Marketing resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The ARN of the resource whose tags should be returned.
    - name: search-campaign-templates
      description: Searches and browses the AWS-authored campaign template catalog.
      flags:
        --aws-services=:
            description: Restrict to templates promoting these AWS services.
            nargs: -1
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --collection=:
            description: Restrict to templates in these collections.
            nargs: -1
        --customer-segments=:
            description: Restrict to templates for these customer segments.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --industry=:
            description: Restrict to templates in these industries.
            nargs: -1
        --language=:
            description: Restrict to templates in these language(s), matched by each template's `LanguageCode`.
            nargs: -1
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Maximum results per page.
        --next-token=: Pagination token.
        --page-size=: The size of each page to get in the AWS service call.
        --search-text=: Free-text query matched against the template's name and description.
        --starting-token=: A token to specify where to start paginating.
        --themes=:
            description: Restrict to templates with these themes.
            nargs: -1
        --use-case=:
            description: Restrict to templates with these campaign use cases.
            nargs: -1
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: start-campaign-asset-activation-task
      description: Activates 1–25 of a campaign's assets as one ordered unit, and returns a task to poll.
      flags:
        --campaign-asset-identifiers=!:
            description: The assets to activate, in any order — the service derives the dependency order and ignores the order given here.
            nargs: -1
        --campaign-identifier=!: The campaign identifier, which also authorizes the call.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Idempotency token.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: start-campaign-asset-export-task
      description: Starts an asynchronous task that packages a campaign's assets into a single downloadable ZIP archive.
      flags:
        --campaign-identifier=!: The campaign whose assets are exported.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Idempotency token.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: tag-resource
      description: Adds or replaces tags on a Partner Central Marketing resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The ARN of the resource to tag.
        --tags=!:
            description: The tags to add or replace.
            nargs: -1
    - name: untag-resource
      description: Removes tags from a Partner Central Marketing resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The ARN of the resource to remove tags from.
        --tag-keys=!:
            description: The tag keys to remove.
            nargs: -1
    - name: update-campaign
      description: Edits a campaign in place.
      flags:
        --campaign-identifier=!: The campaign identifier.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Idempotency token.
        --email-target-engagement-group-ids=:
            description: Engagement groups whose contacts the campaign's emails will also go to (see `CreateCampaign`).
            nargs: -1
        --email-target=: Replaces the campaign's attached recipient list.
        --end-on=: The last day of the campaign's run window, inclusive and in UTC.
        --estimated-budget=: What the partner expects the campaign to cost.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=: The display name.
        --partner-address=: Sets or replaces the partner's postal address.
        --partner-badge=: Sets or replaces the partner's badge, checked exactly as on `CreateCampaign`.
        --privacy-policy-url=: Sets or replaces the URL of the partner's privacy policy.
        --sender-email=: Sets or replaces the address the campaign's emails are sent from.
        --social-connections=: Sets the account the campaign's social posts publish from, per platform.
        --start-on=: The first day of the campaign's run window.
        --target-audience=: Target audience configuration.
        --total-budget=: The campaign's total budget.
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
    - name: update-campaign-asset
      description: Updates an asset's field values, layout or send time.
      flags:
        --campaign-asset-identifier=!: The asset identifier.
        --campaign-identifier=!: The campaign identifier.
        --catalog=!: The catalog (AWS or Sandbox).
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Idempotency token.
        --field-values=:
            description: Value-only updates to the asset's pinned template fields, keyed by FieldId.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --layout=: 'Selects a multi-layout asset''s layout: one of the values in `CampaignAsset.layout.options`.'
        --scheduled-send-at=: 'The send time, with `SendMode: SCHEDULED` and only then.'
        --send-mode=: 'When a **sendable** asset (`EMAIL`, `SOCIAL_POST`) sends: on activation, or at `ScheduledSendAt`.'
      completion:
        flag:
            catalog:
                - AWS
                - Sandbox
            send-mode:
                - ON_ACTIVATION
                - SCHEDULED
