# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: eks-auth
description: Amazon EKS Auth
commands:
    - name: assume-role-for-pod-identity
      description: The Amazon EKS Auth API and the `AssumeRoleForPodIdentity` action are only used by the EKS Pod Identity Agent.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --cluster-name=!: The name of the cluster for the request.
        --eks-node-name=: The Kubernetes node name of the worker node where the pod is running.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --instance-id=: The Amazon EC2 instance ID of the worker node where the pod is running.
        --token=!: The token of the Kubernetes service account for the pod.
        --zone=: The Availability Zone ID of the worker node where the pod is running.
