# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: account-access
description: Account Access
commands:
    - name: create-application
      description: Creates an account access manager instance and its Amazon Web Services account access application in the associated IAM Identity Center instance.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --identity-source=!: Specifies the identity source for the application.
        --tags=: Specifies the tags to assign to the application.
    - name: create-entitlement
      description: Creates an entitlement (assignment) in account access manager.
      flags:
        --application-arn=!: Specifies the ARN of the application to create the entitlement for.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --entitlement=!: Specifies the entitlement configuration, including the principal and the IAM role to grant access to.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-application
      description: Deletes an account access manager application.
      flags:
        --application-arn=!: Specifies the ARN of the application to delete.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-entitlement
      description: Deletes an entitlement from an account access manager application.
      flags:
        --application-arn=!: Specifies the ARN of the application that the entitlement belongs to.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --entitlement-id=!: Specifies the unique identifier of the entitlement to delete.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: get-application
      description: Retrieves details about an account access manager application, including its status, identity source, and tags.
      flags:
        --application-arn=!: Specifies the ARN of the application to retrieve.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: get-entitlement
      description: Retrieves details about a specific entitlement for an account access manager application, including the principal, IAM role, and target account.
      flags:
        --application-arn=!: Specifies the ARN of the application that the entitlement belongs to.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --entitlement-id=!: Specifies the unique identifier of the entitlement to retrieve.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: list-applications
      description: Lists the account access manager applications in your account.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Specifies the maximum number of results to return in a single call.
        --next-token=: Specifies the pagination token from a previous call to retrieve the next set of results.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-entitlements
      description: Lists the entitlements for a specified account access manager application.
      flags:
        --application-arn=!: Specifies the ARN of the application to list entitlements for.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --filter=!: Specifies filter criteria to narrow the entitlements returned.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Specifies the maximum number of results to return in a single call.
        --next-token=: Specifies the pagination token from a previous call to retrieve the next set of results.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-tags-for-resource
      description: Lists the tags associated with an account access manager resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: Specifies the ARN of the resource to list tags for.
    - name: tag-resource
      description: Adds tags to an account access manager resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: Specifies the ARN of the resource to add tags to.
        --tags=!: Specifies the tags to add to the resource.
    - name: untag-resource
      description: Removes tags from an account access manager resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: Specifies the ARN of the resource to remove tags from.
        --tag-keys=!:
            description: Specifies the tag keys to remove from the resource.
            nargs: -1
    - name: wait
      description: Wait  until  a particular condition is satisfied.
      commands:
        - name: application-active
          description: Retrieves details about an account access manager application, including its status, identity source, and tags.
          flags:
            --application-arn=!: Specifies the ARN of the application to retrieve.
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
