# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: account-access-runtime
description: Account Access Runtime
commands:
    - name: get-role-credentials
      description: Returns temporary Amazon Web Services credentials for a role that you are entitled to assume within a tenant.
      flags:
        --access-type=!: The type of access to request for the role.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --role-arn=!: The Amazon Resource Name (ARN) of the role to retrieve credentials for.
        --session-duration=: The duration, in seconds, that the returned credentials remain valid.
        --session-name=: An optional name for the role session.
        --tenant-id=!: The identifier of the tenant that the request applies to.
      completion:
        flag:
            access-type:
                - PROGRAMMATIC_ACCESS
    - name: list-roles
      description: Returns the roles that you are entitled to access within a tenant.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of roles to return in a single response.
        --next-token=: The pagination token from a previous `ListRoles` response.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
        --tenant-id=!: The identifier of the tenant whose roles you want to list.
