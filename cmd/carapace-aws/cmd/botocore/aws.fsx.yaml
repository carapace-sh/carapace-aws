# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: fsx
description: Amazon FSx
commands:
    - name: associate-file-system-aliases
      description: Use this action to associate one or more Domain Name Server (DNS) aliases with an existing Amazon FSx for Windows File Server file system.
      flags:
        --aliases=!:
            description: An array of one or more DNS alias names to associate with the file system.
            nargs: -1
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --file-system-id=!: Specifies the file system with which you want to associate one or more DNS aliases.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: cancel-data-repository-task
      description: Cancels an existing Amazon FSx for Lustre data repository task if that task is in either the `PENDING` or `EXECUTING` state.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --task-id=!: Specifies the data repository task to cancel.
    - name: copy-backup
      description: Copies an existing backup within the same Amazon Web Services account to another Amazon Web Services Region (cross-Region copy) or within the same Amazon Web Services Region (in-Region copy).
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --copy-tags: A Boolean flag indicating whether tags from the source backup should be copied to the backup copy.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --kms-key-id=: ""
        --no-copy-tags: A Boolean flag indicating whether tags from the source backup should be copied to the backup copy.
        --source-backup-id=!: The ID of the source backup.
        --source-region=: The source Amazon Web Services Region of the backup.
        --tags=:
            nargs: -1
    - name: copy-snapshot-and-update-volume
      description: Updates an existing volume by using a snapshot from another Amazon FSx for OpenZFS file system.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --copy-strategy=: Specifies the strategy to use when copying data from a snapshot to the volume.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --options=:
            description: Confirms that you want to delete data on the destination volume that wasn’t there during the previous snapshot replication.
            nargs: -1
        --source-snapshot-arn=!: ""
        --volume-id=!: Specifies the ID of the volume that you are copying the snapshot to.
      completion:
        flag:
            copy-strategy:
                - CLONE
                - FULL_COPY
                - INCREMENTAL_COPY
    - name: create-and-attach-s3-access-point
      description: Creates an S3 access point and attaches it to an Amazon FSx volume.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name you want to assign to this S3 access point.
        --ontap-configuration=: ""
        --open-zfs-configuration=: Specifies the configuration to use when creating and attaching an S3 access point to an FSx for OpenZFS volume.
        --s3-access-point=: Specifies the virtual private cloud (VPC) configuration if you're creating an access point that is restricted to a VPC.
        --type=!: The type of S3 access point you want to create.
      completion:
        flag:
            type:
                - OPENZFS
                - ONTAP
    - name: create-backup
      description: Creates a backup of an existing Amazon FSx for Windows File Server file system, Amazon FSx for Lustre file system, Amazon FSx for NetApp ONTAP volume, or Amazon FSx for OpenZFS file system.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: (Optional) A string of up to 63 ASCII characters that Amazon FSx uses to ensure idempotent creation.
        --file-system-id=: The ID of the file system to back up.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=:
            description: (Optional) The tags to apply to the backup at backup creation.
            nargs: -1
        --volume-id=: (Optional) The ID of the FSx for ONTAP volume to back up.
    - name: create-cluster-peer
      description: Creates a cluster peer relationship between an Amazon FSx for NetApp ONTAP file system and another ONTAP cluster.
      flags:
        --allowed-svm-ids=:
            description: Specifies the IDs of the SVMs on the file system that are preauthorized for SVM peering with the peer cluster.
            nargs: -1
        --allowed-svm-mode=!: Specifies which SVMs on the file system are preauthorized for SVM peering with the peer cluster.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --file-system-id=!: Specifies the ID of the Amazon FSx for NetApp ONTAP file system on which to create the cluster peer relationship.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --passphrase-secret-arn=!: Specifies the Amazon Resource Name (ARN) of the Amazon Web Services Secrets Manager secret containing the cluster peering passphrase.
        --peer-addresses=!:
            description: Specifies the IP addresses of the intercluster logical interfaces (LIFs) on the peer cluster.
            nargs: -1
        --peer-cluster-name=: Specifies the name that the file system uses to identify the peer cluster.
        --tags=:
            nargs: -1
      completion:
        flag:
            allowed-svm-mode:
                - ALL
                - NONE
                - SPECIFIED
    - name: create-data-repository-association
      description: Creates an Amazon FSx for Lustre data repository association (DRA).
      flags:
        --batch-import-meta-data-on-create: Set to `true` to run an import data repository task to import metadata from the data repository to the file system after the data repository association is created.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --data-repository-path=!: The path to the Amazon S3 data repository that will be linked to the file system.
        --file-system-id=!: ""
        --file-system-path=: A path on the file system that points to a high-level directory (such as `/ns1/`) or subdirectory (such as `/ns1/subdir/`) that will be mapped 1-1 with `DataRepositoryPath`.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --imported-file-chunk-size=: For files imported from a data repository, this value determines the stripe count and maximum amount of data per file (in MiB) stored on a single physical disk.
        --no-batch-import-meta-data-on-create: Set to `true` to run an import data repository task to import metadata from the data repository to the file system after the data repository association is created.
        --s3=: The configuration for an Amazon S3 data repository linked to an Amazon FSx Lustre file system with a data repository association.
        --tags=:
            nargs: -1
    - name: create-data-repository-task
      description: Creates an Amazon FSx for Lustre data repository task.
      flags:
        --capacity-to-release=: Specifies the amount of data to release, in GiB, by an Amazon File Cache `AUTO_RELEASE_DATA` task that automatically releases files from the cache.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --file-system-id=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --paths=:
            description: A list of paths for the data repository task to use when the task is processed.
            nargs: -1
        --release-configuration=: The configuration that specifies the last accessed time criteria for files that will be released from an Amazon FSx for Lustre file system.
        --report=!: Defines whether or not Amazon FSx provides a CompletionReport once the task has completed.
        --tags=:
            nargs: -1
        --type=!: Specifies the type of data repository task to create.
      completion:
        flag:
            type:
                - EXPORT_TO_REPOSITORY
                - IMPORT_METADATA_FROM_REPOSITORY
                - RELEASE_DATA_FROM_FILESYSTEM
                - AUTO_RELEASE_DATA
    - name: create-file-cache
      description: Creates a new Amazon File Cache resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: An idempotency token for resource creation, in a string of up to 63 ASCII characters.
        --copy-tags-to-data-repository-associations: A boolean flag indicating whether tags for the cache should be copied to data repository associations.
        --data-repository-associations=:
            description: A list of up to 8 configurations for data repository associations (DRAs) to be created during the cache creation.
            nargs: -1
        --file-cache-type-version=!: Sets the Lustre version for the cache that you're creating, which must be `2.12`.
        --file-cache-type=!: The type of cache that you're creating, which must be `LUSTRE`.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --kms-key-id=: Specifies the ID of the Key Management Service (KMS) key to use for encrypting data on an Amazon File Cache.
        --lustre-configuration=: The configuration for the Amazon File Cache resource being created.
        --no-copy-tags-to-data-repository-associations: A boolean flag indicating whether tags for the cache should be copied to data repository associations.
        --security-group-ids=:
            description: A list of IDs specifying the security groups to apply to all network interfaces created for Amazon File Cache access.
            nargs: -1
        --storage-capacity=!: The storage capacity of the cache in gibibytes (GiB).
        --subnet-ids=!:
            nargs: -1
        --tags=:
            nargs: -1
      completion:
        flag:
            file-cache-type:
                - LUSTRE
    - name: create-file-system
      description: Creates a new, empty Amazon FSx file system.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: A string of up to 63 ASCII characters that Amazon FSx uses to ensure idempotent creation.
        --file-system-type-version=: For FSx for Lustre file systems, sets the Lustre version for the file system that you're creating.
        --file-system-type=!: The type of Amazon FSx file system to create.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --kms-key-id=: ""
        --lustre-configuration=: ""
        --network-type=: The network type of the Amazon FSx file system that you are creating.
        --ontap-configuration=: ""
        --open-zfs-configuration=: The OpenZFS configuration for the file system that's being created.
        --security-group-ids=:
            description: A list of IDs specifying the security groups to apply to all network interfaces created for file system access.
            nargs: -1
        --storage-capacity=: Sets the storage capacity of the file system that you're creating, in gibibytes (GiB).
        --storage-type=: Sets the storage class for the file system that you're creating.
        --subnet-ids=!:
            description: Specifies the IDs of the subnets that the file system will be accessible from.
            nargs: -1
        --tags=:
            description: The tags to apply to the file system that's being created.
            nargs: -1
        --windows-configuration=: The Microsoft Windows configuration for the file system that's being created.
      completion:
        flag:
            file-system-type:
                - WINDOWS
                - LUSTRE
                - ONTAP
                - OPENZFS
            network-type:
                - IPV4
                - DUAL
            storage-type:
                - SSD
                - HDD
                - INTELLIGENT_TIERING
    - name: create-file-system-from-backup
      description: Creates a new Amazon FSx for Lustre, Amazon FSx for Windows File Server, or Amazon FSx for OpenZFS file system from an existing Amazon FSx backup.
      flags:
        --backup-id=!: ""
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: A string of up to 63 ASCII characters that Amazon FSx uses to ensure idempotent creation.
        --file-system-type-version=: Sets the version for the Amazon FSx for Lustre file system that you're creating from a backup.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --kms-key-id=: ""
        --lustre-configuration=: ""
        --network-type=: Sets the network type for the Amazon FSx for OpenZFS file system that you're creating from a backup.
        --open-zfs-configuration=: The OpenZFS configuration for the file system that's being created.
        --security-group-ids=:
            description: A list of IDs for the security groups that apply to the specified network interfaces created for file system access.
            nargs: -1
        --storage-capacity=: Sets the storage capacity of the OpenZFS file system that you're creating from a backup, in gibibytes (GiB).
        --storage-type=: Sets the storage type for the Windows, OpenZFS, or Lustre file system that you're creating from a backup.
        --subnet-ids=!:
            description: Specifies the IDs of the subnets that the file system will be accessible from.
            nargs: -1
        --tags=:
            description: The tags to be applied to the file system at file system creation.
            nargs: -1
        --windows-configuration=: The configuration for this Microsoft Windows file system.
      completion:
        flag:
            network-type:
                - IPV4
                - DUAL
            storage-type:
                - SSD
                - HDD
                - INTELLIGENT_TIERING
    - name: create-snapmirror-policy
      description: Creates a SnapMirror policy for an Amazon FSx for NetApp ONTAP file system or storage virtual machine (SVM).
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --file-system-id=: Specifies the ID of the Amazon FSx for NetApp ONTAP file system on which to create the SnapMirror policy.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: Specifies the name of the SnapMirror policy.
        --network-compression-enabled: Specifies whether SnapMirror compresses data when it transfers the data over the network.
        --no-network-compression-enabled: Specifies whether SnapMirror compresses data when it transfers the data over the network.
        --retention-rules=:
            description: Specifies the rules that determine which snapshots SnapMirror retains on the destination volume, based on their SnapMirror labels.
            nargs: -1
        --snapshot-copy-mode=: 'Specifies which snapshots SnapMirror transfers to the destination volume:'
        --storage-virtual-machine-id=: Specifies the ID of the SVM on which to create the SnapMirror policy.
        --tags=:
            nargs: -1
        --throttle-in-kbps=: Specifies the maximum bandwidth, in kilobytes per second (KBps), that SnapMirror uses to transfer data.
        --transfer-schedule=: Specifies the name of the ONTAP schedule that determines when SnapMirror transfers data.
      completion:
        flag:
            snapshot-copy-mode:
                - COPY_ALL_SOURCE_SNAPSHOTS
                - COPY_LATEST_SOURCE_SNAPSHOT
                - NO_CREATE_SNAPSHOT_ON_SOURCE
    - name: create-snapmirror-relationship
      description: Creates a SnapMirror relationship that replicates data from a source volume to a destination volume on an Amazon FSx for NetApp ONTAP file system.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --destination=!: Specifies the destination endpoint of the SnapMirror relationship.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --policy-id=: Specifies the ID of the SnapMirror policy that the SnapMirror relationship uses.
        --source=!: Specifies the source endpoint of the SnapMirror relationship.
        --tags=:
            nargs: -1
        --throttle-in-kbps=: Specifies the maximum bandwidth, in kilobytes per second (KBps), that SnapMirror uses to transfer data for the relationship.
        --transfer-schedule=: Specifies the name of the ONTAP schedule that determines when SnapMirror transfers data for the relationship.
    - name: create-snapshot
      description: Creates a snapshot of an existing Amazon FSx for OpenZFS or Amazon FSx for NetApp ONTAP volume.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name of the snapshot.
        --ontap-configuration=: Specifies the configuration to use when creating the ONTAP snapshot.
        --tags=:
            nargs: -1
        --volume-id=!: The ID of the volume that you are taking a snapshot of.
    - name: create-snapshot-policy
      description: Creates a snapshot policy for an Amazon FSx for NetApp ONTAP file system or storage virtual machine (SVM).
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --enabled: Specifies whether the snapshot policy is enabled.
        --file-system-id=: Specifies the ID of the Amazon FSx for NetApp ONTAP file system on which to create the snapshot policy.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: Specifies the name of the snapshot policy.
        --no-enabled: Specifies whether the snapshot policy is enabled.
        --schedules=!:
            description: Specifies the schedules on which ONTAP creates snapshots for the snapshot policy.
            nargs: -1
        --storage-virtual-machine-id=: Specifies the ID of the SVM on which to create the snapshot policy.
        --tags=:
            nargs: -1
    - name: create-storage-virtual-machine
      description: Creates a storage virtual machine (SVM) for an Amazon FSx for ONTAP file system.
      flags:
        --active-directory-configuration=: Describes the self-managed Microsoft Active Directory to which you want to join the SVM.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --file-system-id=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name of the SVM.
        --root-volume-security-style=: The security style of the root volume of the SVM.
        --svm-admin-password=: The password to use when managing the SVM using the NetApp ONTAP CLI or REST API.
        --tags=:
            nargs: -1
      completion:
        flag:
            root-volume-security-style:
                - UNIX
                - NTFS
                - MIXED
    - name: create-storage-virtual-machine-peer
      description: Creates a storage virtual machine (SVM) peer relationship between an SVM on an Amazon FSx for NetApp ONTAP file system and another SVM.
      flags:
        --applications=!:
            description: Specifies the applications that the SVM peer relationship authorizes.
            nargs: -1
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --peer-cluster-name=: Specifies the name of the peer cluster that the peer SVM is on.
        --peer-svm-alias=: Specifies the name that the local cluster uses to identify the peer SVM.
        --peer-svm-name=!: Specifies the name of the SVM to peer with.
        --storage-virtual-machine-id=!: Specifies the ID of the SVM on which to create the SVM peer relationship.
        --tags=:
            nargs: -1
    - name: create-volume
      description: Creates an FSx for ONTAP or Amazon FSx for OpenZFS storage volume.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: Specifies the name of the volume that you're creating.
        --ontap-configuration=: Specifies the configuration to use when creating the ONTAP volume.
        --open-zfs-configuration=: Specifies the configuration to use when creating the OpenZFS volume.
        --tags=:
            nargs: -1
        --volume-type=!: Specifies the type of volume to create; `ONTAP` and `OPENZFS` are the only valid volume types.
      completion:
        flag:
            volume-type:
                - ONTAP
                - OPENZFS
    - name: create-volume-from-backup
      description: Creates a new Amazon FSx for NetApp ONTAP volume from an existing Amazon FSx volume backup.
      flags:
        --backup-id=!: ""
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name of the new volume you're creating.
        --ontap-configuration=: Specifies the configuration of the ONTAP volume that you are creating.
        --tags=:
            nargs: -1
    - name: delete-backup
      description: Deletes an Amazon FSx backup.
      flags:
        --backup-id=!: The ID of the backup that you want to delete.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: A string of up to 63 ASCII characters that Amazon FSx uses to ensure idempotent deletion.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-cluster-peer
      description: Deletes an Amazon FSx for NetApp ONTAP cluster peer relationship.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --cluster-peer-id=!: The ID of the cluster peer that you are deleting.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-data-repository-association
      description: Deletes a data repository association on an Amazon FSx for Lustre file system.
      flags:
        --association-id=!: The ID of the data repository association that you want to delete.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --delete-data-in-file-system: Set to `true` to delete the data in the file system that corresponds to the data repository association.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --no-delete-data-in-file-system: Set to `true` to delete the data in the file system that corresponds to the data repository association.
    - name: delete-file-cache
      description: Deletes an Amazon File Cache resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --file-cache-id=!: The ID of the cache that's being deleted.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-file-system
      description: Deletes a file system.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: A string of up to 63 ASCII characters that Amazon FSx uses to ensure idempotent deletion.
        --file-system-id=!: The ID of the file system that you want to delete.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --lustre-configuration=: ""
        --open-zfs-configuration=: The configuration object for the OpenZFS file system used in the `DeleteFileSystem` operation.
        --windows-configuration=: ""
    - name: delete-snapmirror-policy
      description: Deletes an Amazon FSx for NetApp ONTAP SnapMirror policy.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --snapmirror-policy-id=!: The ID of the SnapMirror policy that you are deleting.
    - name: delete-snapmirror-relationship
      description: Deletes an Amazon FSx for NetApp ONTAP SnapMirror relationship.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --snapmirror-relationship-id=!: The ID of the SnapMirror relationship that you are deleting.
    - name: delete-snapshot
      description: Deletes an Amazon FSx for OpenZFS or Amazon FSx for NetApp ONTAP snapshot.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --snapshot-id=!: The ID of the snapshot that you want to delete.
    - name: delete-snapshot-policy
      description: Deletes an Amazon FSx for NetApp ONTAP snapshot policy.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --snapshot-policy-id=!: The ID of the snapshot policy that you are deleting.
    - name: delete-storage-virtual-machine
      description: Deletes an existing Amazon FSx for ONTAP storage virtual machine (SVM).
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --storage-virtual-machine-id=!: The ID of the SVM that you want to delete.
    - name: delete-storage-virtual-machine-peer
      description: Deletes an Amazon FSx for NetApp ONTAP storage virtual machine (SVM) peer relationship.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
