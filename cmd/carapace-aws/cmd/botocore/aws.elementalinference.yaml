# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: elementalinference
description: AWS Elemental Inference
commands:
    - name: associate-feed
      description: Associates a resource with the feed.
      flags:
        --associated-resource-name=!: An identifier for the resource.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --dry-run: Set to true if you want to do a dry run of the associate action.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the feed.
        --no-dry-run: Set to true if you want to do a dry run of the associate action.
        --outputs=!:
            description: An array of one or more outputs that you want to add to this feed now, to supplement any outputs that you specified when you created or updated the feed.
            nargs: -1
    - name: create-dictionary
      description: Creates a custom dictionary for improving transcription accuracy.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --entries=: The dictionary entries payload.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --language=!: The language of the dictionary entries.
        --name=!: A user-friendly name for this dictionary.
        --tags=: Optional tags to associate with the dictionary.
      completion:
        flag:
            language:
                - eng
                - fra
                - ita
                - deu
                - spa
                - por
    - name: create-feed
      description: Creates a feed.
      flags:
        --access-role-arn=: The ARN of an IAM role that Elemental Inference assumes to access resources in your account on your behalf.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: A user-friendly name for this feed.
        --outputs=!:
            description: An array of outputs for this feed.
            nargs: -1
        --tags=: Optional tags.
    - name: create-function
      description: Creates a function.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: The description of the function.
        --event-bridge-delivery=: Specifies whether Elemental Inference also sends this function's results to Amazon EventBridge.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: A name for this function.
        --request-expression=!: The JSONata expression that builds the request.
        --response-expression=: The JSONata expression that selects what to store.
        --tags=: The tags to associate with this function.
        --target=!: The destination for the request that the function builds.
      completion:
        flag:
            event-bridge-delivery:
                - ENABLED
                - DISABLED
    - name: create-question-set
      description: Creates a question set.
      flags:
        --choose-one=:
            description: An array of questions that Elemental Inference answers by choosing one of their options.
            nargs: -1
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: A user-friendly name for this question set.
        --tags=: Optional tags to associate with the question set.
        --yes-no-per-option=:
            description: An array of questions that you ask about each of their options.
            nargs: -1
        --yes-no=:
            description: An array of questions that Elemental Inference answers with yes or no. You can specify up to 50 yesNo questions.
            nargs: -1
    - name: create-question-set-version
      description: Publishes the DRAFT version of the specified question set as a new version.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: A description of the new version.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the question set whose DRAFT version you want to publish.
        --sha256=: The SHA-256 hash of the DRAFT version that you want to publish, as returned by GetQuestionSet or UpdateQuestionSet.
    - name: create-schedule-action
      description: Creates a schedule action on a feed.
      flags:
        --action-name=!: A name for the schedule action.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: Specifies the ID of the feed that you want to add the schedule action to.
        --operations=!:
            description: Specifies the list of configuration changes that you want to make to the feed.
            nargs: -1
        --start-configuration=!: Specifies when the action runs.
    - name: delete-dictionary
      description: Deletes the specified dictionary.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the dictionary to delete.
    - name: delete-feed
      description: Deletes the specified feed.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the feed.
    - name: delete-feed-policy
      description: Deletes the resource-based policy attached to the specified feed.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the feed whose policy you want to delete.
    - name: delete-function
      description: Deletes a function.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the function.
    - name: delete-question-set
      description: Deletes the specified question set, including its DRAFT version and all its published versions.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the question set to delete.
    - name: delete-question-set-version
      description: Deletes a published version of the specified question set.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the question set that contains the version.
        --question-set-version=!: The number of the published version to delete.
    - name: delete-schedule-action
      description: Deletes a schedule action from a feed.
      flags:
        --action-name=!: The name of the schedule action that you want to delete.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the feed that holds the schedule action.
    - name: disassociate-feed
      description: Releases the resource (the source media) that is associated with this feed.
      flags:
        --associated-resource-name=!: The name of the resource currently associated with the feed.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --dry-run: Set to true if you want to do a dry run of the disassociate action.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the feed where you want to release the resource.
        --no-dry-run: Set to true if you want to do a dry run of the disassociate action.
    - name: export-dictionary-entries
      description: Exports the entries from the specified dictionary.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the dictionary whose entries you want to export.
    - name: get-dictionary
      description: Retrieves information about the specified dictionary.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the dictionary to retrieve.
    - name: get-feed
      description: Retrieves information about the specified feed.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the feed to query.
    - name: get-feed-policy
      description: Retrieves the resource-based policy attached to the specified feed.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the feed whose policy you want to retrieve.
    - name: get-fixture
      description: Retrieves information about the specified fixture (a sports event, such as a specific basketball game).
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --fixture-id=!: The ID of the fixture to retrieve, as returned by SearchFixtures.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: get-function
      description: Retrieves the details of a function, including its expressions, the media context that Elemental Inference derived from the request expression, and the feeds that currently reference it.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the function.
    - name: get-question-set
      description: Retrieves information about the specified question set at one version.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the question set to retrieve.
        --question-set-version=: 'The version of the question set to retrieve: DRAFT or the number of a published version.'
    - name: list-dictionaries
      description: Lists the dictionaries in your account.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return per API request.
        --next-token=: The token that identifies the next batch of results to return.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-feeds
      description: Displays a list of feeds that belong to this AWS account.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return per API request.
        --next-token=: The token that identifies the batch of results that you want to see.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-functions
      description: Lists the functions in this account, in this Region.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of functions to return in one response.
        --next-token=: The token that identifies the page of results to return.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-question-set-versions
      description: Lists the versions of the specified question set.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the question set whose versions you want to list.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return per API request.
        --next-token=: The token that identifies the next batch of results to return.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-question-sets
      description: Lists the question sets in your account.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return per API request.
        --next-token=: The token that identifies the next batch of results to return.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-schedule-actions
      description: Displays a list of the schedule actions on a feed, including the status of each action and, for a failed action, information about why it failed.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the feed that you want to query.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return for each API request.
        --next-token=: The token that identifies the batch of results that you want to see.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-tags-for-resource
      description: List all tags that are on an Elemental Inference resource in the current region.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The ARN of the resource whose tags you want to query.
    - name: put-feed-policy
      description: Attaches or replaces a resource-based policy on the specified feed.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the feed to attach the policy to.
        --policy=!: The resource-based policy document to attach to the feed.
    - name: search-fixtures
      description: Searches for the fixtures (sports events, such as a specific basketball game) that are available for a sport in a date window.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --end-date=: The last day of the search window, in UTC.
        --filters=:
            description: An array of filters that narrow the results.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of fixtures to return for each API request.
        --next-token=: The token that identifies the batch of results that you want to see.
        --page-size=: The size of each page to get in the AWS service call.
        --sport=!: The sport to search for fixtures.
        --start-date=!: The first day of the search window, in UTC.
        --starting-token=: A token to specify where to start paginating.
      completion:
        flag:
            sport:
                - basketball
                - american-football
    - name: tag-resource
      description: Associates the specified tags to the resource identified by the specified resourceArn in the current region.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The ARN of the resource where you want to add tags.
        --tags=!: A list of tags to add to the resource.
    - name: untag-resource
      description: Deletes specified tags from the specified resource in the current region.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The ARN of the resource where you want to delete one or more tags.
        --tag-keys=!:
            description: The keys of the tags to delete.
            nargs: -1
    - name: update-dictionary
      description: Updates the specified dictionary.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --entries=: New dictionary entries.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the dictionary to update.
        --language=: A new language for the dictionary.
        --name=: A new name for the dictionary.
      completion:
        flag:
            language:
                - eng
                - fra
                - ita
                - deu
                - spa
                - por
    - name: update-feed
      description: Updates the name and/or outputs in a feed.
      flags:
        --access-role-arn=: The ARN of an IAM role that Elemental Inference assumes to access resources in your account on your behalf.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the feed to update.
        --name=!: Required.
        --outputs=!:
            description: Required.
            nargs: -1
    - name: update-function
      description: Updates a function.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: A new description for the function.
        --event-bridge-delivery=: Specifies whether Elemental Inference also sends this function's marked results to Amazon EventBridge, as described for CreateFunction.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the function.
        --name=: A new name for the function.
        --request-expression=: A new request expression for the function.
        --response-expression=: A new response expression for the function.
        --target=: A new target for the function.
      completion:
        flag:
            event-bridge-delivery:
                - ENABLED
                - DISABLED
    - name: update-question-set
      description: Updates the DRAFT version of the specified question set.
      flags:
        --choose-one=:
            description: An array of questions that Elemental Inference answers by choosing one of their options, to replace all the chooseOne questions in DRAFT.
            nargs: -1
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the question set to update.
        --name=: A new name for the question set.
        --yes-no-per-option=:
            description: An array of questions that you ask about each of their options, to replace all the yesNoPerOption questions in DRAFT.
            nargs: -1
        --yes-no=:
            description: An array of questions that Elemental Inference answers with yes or no, to replace all the yesNo questions in DRAFT.
            nargs: -1
    - name: wait
      description: Wait  until  a particular condition is satisfied.
      commands:
        - name: feed-deleted
          description: Retrieves information about the specified feed.
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
            --id=!: The ID of the feed to query.
