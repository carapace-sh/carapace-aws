# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: agent-discovery
description: Agent Discovery
commands:
    - name: search-public-records
      description: Search public agent records across the authoritative + crawler indexes.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --filters=: 'Structured filter narrowing the results, in the grammar of Agent Registry''s SearchDiscoverableRegistryRecords `filters`: `$eq`, `$ne` and `$in` on a field, with `$and` or `$or` over single-condition objects, never nested.'
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Max records per page.
        --next-token=: Opaque composite-cursor pagination token (O-DM12).
        --page-size=: The size of each page to get in the AWS service call.
        --search-query=: Free-text natural-language query (ARD `text`).
        --starting-token=: A token to specify where to start paginating.
