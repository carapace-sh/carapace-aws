# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: iotsitewise
description: AWS IoT SiteWise
commands:
    - name: associate-assets
      description: Associates a child asset with the given parent asset through a hierarchy defined in the parent asset's model.
      flags:
        --asset-id=!: The ID of the parent asset.
        --child-asset-id=!: The ID of the child asset to be associated.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --hierarchy-id=!: The ID of a hierarchy in the parent asset's model.
    - name: associate-time-series-to-asset-property
      description: Associates a time series (data stream) with an asset property.
      flags:
        --alias=!: The alias that identifies the time series.
        --asset-id=!: The ID of the asset in which the asset property was created.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --property-id=!: The ID of the asset property.
    - name: batch-associate-data-segments-to-dataset
      description: Associates a batch of data segments with a curated dataset.
      flags:
        --associate-data-segment-entries=!:
            description: The list of data segment entries to associate with the dataset.
            nargs: -1
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure that the request is idempotent.
        --dataset-id=!: The ID of the curated dataset to associate data segments with.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --workspace-name=!: The name of the workspace that contains the dataset.
    - name: batch-associate-project-assets
      description: The IoT SiteWise Monitor feature will no longer be open to new customers starting November 7, 2025. If you would like to use the IoT SiteWise Monitor feature, sign up prior to that date.
      flags:
        --asset-ids=!:
            description: The IDs of the assets to be associated to the project.
            nargs: -1
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --project-id=!: The ID of the project to which to associate the assets.
    - name: batch-delete-dataset-data-segments
      description: Deletes a batch of data segments from a session dataset.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure that the request is idempotent.
        --dataset-id=!: The ID of the session dataset from which to delete data segments.
        --delete-data-segment-entries=!:
            description: The list of data segment entries to delete.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --workspace-name=!: The name of the workspace that contains the dataset.
    - name: batch-disassociate-data-segments-from-dataset
      description: Disassociates a batch of data segments from a curated dataset.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure that the request is idempotent.
        --dataset-id=!: The ID of the curated dataset to disassociate data segments from.
        --disassociate-data-segment-entries=!:
            description: The list of data segment entries to disassociate from the dataset.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --workspace-name=!: The name of the workspace that contains the dataset.
    - name: batch-disassociate-project-assets
      description: Disassociates a group (batch) of assets from an IoT SiteWise Monitor project.
      flags:
        --asset-ids=!:
            description: The IDs of the assets to be disassociated from the project.
            nargs: -1
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --project-id=!: The ID of the project from which to disassociate the assets.
    - name: batch-get-asset-property-aggregates
      description: Gets aggregated values (for example, average, minimum, and maximum) for one or more asset properties.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --entries=!:
            description: The list of asset property aggregate entries for the batch get request.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-results=: The maximum number of results to return for each paginated request.
        --next-token=: The token to be used for the next set of paginated results.
    - name: batch-get-asset-property-value
      description: Gets the current value for one or more asset properties.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --entries=!:
            description: The list of asset property value entries for the batch get request.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --next-token=: The token to be used for the next set of paginated results.
    - name: batch-get-asset-property-value-history
      description: Gets the historical values for one or more asset properties.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --entries=!:
            description: The list of asset property historical value entries for the batch get request.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-results=: The maximum number of results to return for each paginated request.
        --next-token=: The token to be used for the next set of paginated results.
    - name: batch-put-asset-property-value
      description: Sends a list of asset property values to IoT SiteWise.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --enable-partial-entry-processing: This setting enables partial ingestion at entry-level.
        --entries=!:
            description: The list of asset property value entries for the batch put request.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --no-enable-partial-entry-processing: This setting enables partial ingestion at entry-level.
    - name: cancel-enrichment-job
      description: Cancels a running or pending enrichment job.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --job-id=!: The unique identifier of the enrichment job to cancel.
        --workspace-name=!: The name of the IoT SiteWise workspace containing the enrichment job to cancel.
    - name: cancel-pipeline-execution
      description: Cancels a pipeline execution in the specified workspace.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --pipeline-execution-id=!: The unique identifier of the pipeline execution.
        --pipeline-name=!: The name of the pipeline.
        --reason=: A message describing why the pipeline execution is being cancelled.
        --workspace-name=!: The name of the workspace.
    - name: cancel-query
      description: Cancels a running query.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --query-id=!: The unique identifier for the query execution to cancel.
        --workspace-name=!: The name of the workspace associated with the query.
    - name: create-access-policy
      description: The IoT SiteWise Monitor feature will no longer be open to new customers starting November 7, 2025. If you would like to use the IoT SiteWise Monitor feature, sign up prior to that date.
      flags:
        --access-policy-identity=!: The identity for this access policy.
        --access-policy-permission=!: The permission level for this access policy.
        --access-policy-resource=!: The IoT SiteWise Monitor resource for this access policy.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: A list of key-value pairs that contain metadata for the access policy.
      completion:
        flag:
            access-policy-permission:
                - ADMINISTRATOR
                - VIEWER
    - name: create-application
      description: Creates a new application for the workspace and IdC application provided
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Unique client token for idempotent request handling
        --description=: Description of the application
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --idc-instance-arn=!: Identity Center Instance ARN to create the application in
        --name=!: Name of the application
        --tags=: A list of key-value pairs that contain metadata for the application.
        --workspace-name=!: Name of the workspace to associate with the underlying Application
    - name: create-asset
      description: Creates an asset from an existing asset model.
      flags:
        --asset-description=: A description for the asset.
        --asset-external-id=: An external ID to assign to the asset.
        --asset-id=: The ID to assign to the asset, if desired.
        --asset-model-id=!: The ID of the asset model from which to create the asset.
        --asset-name=!: A friendly name for the asset.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: A list of key-value pairs that contain metadata for the asset.
    - name: create-asset-model
      description: Creates an asset model from specified property and hierarchy definitions.
      flags:
        --asset-model-composite-models=:
            description: The composite models that are part of this asset model.
            nargs: -1
        --asset-model-description=: A description for the asset model.
        --asset-model-external-id=: An external ID to assign to the asset model.
        --asset-model-hierarchies=:
            description: The hierarchy definitions of the asset model.
            nargs: -1
        --asset-model-id=: The ID to assign to the asset model, if desired.
        --asset-model-name=!: A unique name for the asset model.
        --asset-model-properties=:
            description: The property definitions of the asset model.
            nargs: -1
        --asset-model-type=: The type of asset model.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: A list of key-value pairs that contain metadata for the asset model.
      completion:
        flag:
            asset-model-type:
                - ASSET_MODEL
                - COMPONENT_MODEL
                - INTERFACE
    - name: create-asset-model-composite-model
      description: Creates a custom composite model from specified property and hierarchy definitions.
      flags:
        --asset-model-composite-model-description=: A description for the composite model.
        --asset-model-composite-model-external-id=: An external ID to assign to the composite model.
        --asset-model-composite-model-id=: The ID of the composite model.
        --asset-model-composite-model-name=!: A unique name for the composite model.
        --asset-model-composite-model-properties=:
            description: The property definitions of the composite model.
            nargs: -1
        --asset-model-composite-model-type=!: The composite model type.
        --asset-model-id=!: The ID of the asset model this composite model is a part of.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --composed-asset-model-id=: The ID of a component model which is reused to create this composite model.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --if-match=: The expected current entity tag (ETag) for the asset model’s latest or active version (specified using `matchForVersionType`).
        --if-none-match=: Accepts **\*** to reject the create request if an active version (specified using `matchForVersionType` as `ACTIVE`) already exists for the asset model.
        --match-for-version-type=: Specifies the asset model version type (`LATEST` or `ACTIVE`) used in conjunction with `If-Match` or `If-None-Match` headers to determine the target ETag for the create operation.
        --parent-asset-model-composite-model-id=: The ID of the parent composite model in this asset model relationship.
      completion:
        flag:
            match-for-version-type:
                - LATEST
                - ACTIVE
    - name: create-bulk-import-job
      description: Defines a job to ingest data to IoT SiteWise from Amazon S3.
      flags:
        --adaptive-ingestion: If set to true, ingest new data into IoT SiteWise storage.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --dataset-id=: The ID of the session dataset to ingest data into.
        --delete-files-after-import: If set to true, your data files is deleted from S3, after ingestion into IoT SiteWise storage.
        --error-report-location=!: The Amazon S3 destination where errors associated with the job creation request are saved.
        --files=!:
            description: The files in the specified Amazon S3 bucket that contain your data.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --job-configuration=: Contains the configuration information of a job, such as the file format used to save data in Amazon S3.
        --job-name=!: The unique name that helps identify the job request.
        --job-role-arn=!: The [ARN](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of the IAM role that allows IoT SiteWise to read Amazon S3 data.
        --no-adaptive-ingestion: If set to true, ingest new data into IoT SiteWise storage.
        --no-delete-files-after-import: If set to true, your data files is deleted from S3, after ingestion into IoT SiteWise storage.
        --workspace-name=: The name of the workspace that contains the session dataset.
    - name: create-computation-model
      description: Create a computation model with a configuration and data binding.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --computation-model-configuration=!: The configuration for the computation model.
        --computation-model-data-binding=!: The data binding for the computation model.
        --computation-model-description=: The description of the computation model.
        --computation-model-name=!: The name of the computation model.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: A list of key-value pairs that contain metadata for the asset.
    - name: create-dashboard
      description: The IoT SiteWise Monitor feature will no longer be open to new customers starting November 7, 2025. If you would like to use the IoT SiteWise Monitor feature, sign up prior to that date.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --dashboard-definition=!: The dashboard definition specified in a JSON literal.
        --dashboard-description=: A description for the dashboard.
        --dashboard-name=!: A friendly name for the dashboard.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --project-id=!: The ID of the project in which to create the dashboard.
        --tags=: A list of key-value pairs that contain metadata for the dashboard.
    - name: create-dataset
      description: Creates a dataset.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --dataset-config=: The configuration for the dataset.
        --dataset-description=: A description about the dataset, and its functionality.
        --dataset-id=: The ID of the dataset.
        --dataset-name=!: The name of the dataset.
        --dataset-source=!: The data source for the dataset.
        --dataset-type=: 'The type of dataset: a session dataset, a curated dataset, or a connection to an external datasource.'
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --metadata=: The metadata for the dataset, provided as key-value pairs.
        --tags=: A list of key-value pairs that contain metadata for the access policy.
        --workspace-name=: The name of the workspace that contains the dataset.
      completion:
        flag:
            dataset-type:
                - SESSION
                - CURATED
                - EXTERNAL
    - name: create-dataset-export-job
      description: Starts an asynchronous job that exports dataset and time-series data from a workspace to Amazon S3.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --destination-s3-uri=!: The S3 URI where output clips will be written.
        --error-report-location=!: The location where the error report will be written on failure.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --input=!: The processing input source.
        --workspace-name=!: The name of the workspace in which to create the dataset export job.
    - name: create-enrichment-job
      description: Creates an asynchronous enrichment job to analyze time-series sensor data.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Optional unique token that makes the operation idempotent.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --job-configuration=!: Configuration defining the type of enrichment analysis to perform and which video data to analyze.
        --workspace-name=!: The name of the IoT SiteWise workspace containing the video data to analyze.
    - name: create-gateway
      description: Creates a gateway, which is a virtual or edge device that delivers industrial data streams from local servers to IoT SiteWise.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-name=!: A unique name for the gateway.
        --gateway-platform=!: The gateway's platform.
        --gateway-version=: The version of the gateway to create.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: A list of key-value pairs that contain metadata for the gateway.
    - name: create-pipeline
      description: Creates a new pipeline in the specified workspace.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --computations=!:
            description: The list of compute nodes that form the pipeline DAG.
            nargs: -1
        --description=: A description of the pipeline.
        --environment-variables=: Environment variables shared across all compute nodes in the pipeline.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --pipeline-name=!: The name of the pipeline to create.
        --tags=: A list of key-value pairs that contain metadata for the pipeline.
        --workspace-name=!: The name of the workspace.
    - name: create-portal
      description: The IoT SiteWise Monitor feature will no longer be open to new customers starting November 7, 2025. If you would like to use the IoT SiteWise Monitor feature, sign up prior to that date.
      flags:
        --alarms=: Contains the configuration information of an alarm created in an IoT SiteWise Monitor portal.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --notification-sender-email=: The email address that sends alarm notifications.
        --portal-auth-mode=: The service to use to authenticate users to the portal.
        --portal-contact-email=!: The Amazon Web Services administrator's contact email address.
        --portal-description=: A description for the portal.
        --portal-logo-image-file=: A logo image to display in the portal.
        --portal-name=!: A friendly name for the portal.
        --portal-type-configuration=: The configuration entry associated with the specific portal type.
        --portal-type=: Define the type of portal.
        --role-arn=!: The [ARN](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of a service role that allows the portal's users to access your IoT SiteWise resources on your behalf.
        --tags=: A list of key-value pairs that contain metadata for the portal.
      completion:
        flag:
            portal-auth-mode:
                - IAM
                - SSO
            portal-type:
                - SITEWISE_PORTAL_V1
                - SITEWISE_PORTAL_V2
    - name: create-project
      description: The IoT SiteWise Monitor feature will no longer be open to new customers starting November 7, 2025. If you would like to use the IoT SiteWise Monitor feature, sign up prior to that date.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --portal-id=!: The ID of the portal in which to create the project.
        --project-description=: A description for the project.
        --project-name=!: A friendly name for the project.
        --tags=: A list of key-value pairs that contain metadata for the project.
    - name: create-task
      description: Creates a new task in the specified workspace.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --description=: A description of the task.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: A list of key-value pairs that contain metadata for the task.
        --task-configuration=!: The task execution configuration.
        --task-name=!: The name of the task to create.
        --workspace-name=!: The name of the workspace.
    - name: create-workspace
      description: Creates a workspace in IoT SiteWise.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure that the request is idempotent.
        --encryption-configuration=!: The encryption configuration for the workspace.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: A list of key-value pairs that contain metadata for the workspace.
        --workspace-description=: A description for the workspace.
        --workspace-name=!: The name of the workspace to create.
    - name: delete-access-policy
      description: Deletes an access policy that grants the specified identity access to the specified IoT SiteWise Monitor resource.
      flags:
        --access-policy-id=!: The ID of the access policy to be deleted.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-application
      description: Deletes an application by ID
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: ID of the Application to delete
        --workspace-name=!: Name of the workspace to associate with the underlying Application
    - name: delete-asset
      description: Deletes an asset.
      flags:
        --asset-id=!: The ID of the asset to delete.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-asset-model
      description: Deletes an asset model.
      flags:
        --asset-model-id=!: The ID of the asset model to delete.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
