# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: agent-registry-control
description: Agent Registry Control
commands:
    - name: create-registry
      description: Creates a new registry, a catalog that organizes registry records and defines their discovery authorization and record approval behavior.
      flags:
        --approval-configuration=: Approval configuration for registry records
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Client token for idempotency
        --description=: The description of the registry
        --discovery-configuration=: Discovery configuration for the registry
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name of the registry
        --tags=: Tags to associate with the registry
    - name: create-registry-record
      description: Creates a registry record within a registry.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Client token for idempotency
        --description=: The description of the registry record
        --descriptors=!: The typed descriptor content for the registry record
        --display-name=: The human-readable display name of the registry record
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name of the registry record
        --record-type=!: The type of the registry record, which determines the descriptor format
        --record-version=: The version of the registry record
        --registry-id=!: The identifier of the registry in which to create the record (ARN or ID)
        --tags=: Tags to associate with the registry record
      completion:
        flag:
            record-type:
                - MCP
                - AGENT
                - CUSTOM
                - SKILL
    - name: delete-registry
      description: Deletes a registry.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --registry-id=!: The identifier of the registry to delete (ARN or ID)
    - name: delete-registry-record
      description: Deletes a registry record
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --record-id=!: The identifier of the registry record to delete (ARN or ID)
        --registry-id=!: The identifier of the registry containing the record (ARN or ID)
    - name: get-registry
      description: Gets a registry by identifier (ARN or ID)
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --registry-id=!: The identifier of the registry to retrieve (ARN or ID)
    - name: get-registry-record
      description: Retrieves the details of a registry record
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --record-id=!: The identifier of the registry record to retrieve (ARN or ID)
        --registry-id=!: The identifier of the registry containing the record (ARN or ID)
    - name: list-registries
      description: Lists the registries in the caller's account and Region, with optional filtering by status and discovery authorizer type
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --filters=:
            description: Filters to apply to the registry list
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Maximum number of results to return
        --next-token=: Token for pagination
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-registry-records
      description: Lists the registry records within a registry, with optional filtering by name, status, and record type
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --filters=:
            description: Filters to apply to the registry record list
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: Maximum number of records to return
        --next-token=: Token for pagination
        --page-size=: The size of each page to get in the AWS service call.
        --registry-id=!: The identifier of the registry to list records from (ARN or ID)
        --starting-token=: A token to specify where to start paginating.
    - name: list-tags-for-resource
      description: List the tags on a resource
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: ""
    - name: submit-registry-record-for-approval
      description: Submits a DRAFT registry record for approval, moving it into the registry's approval workflow.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --record-id=!: The identifier of the registry record to submit for approval (ARN or ID)
        --registry-id=!: The identifier of the registry containing the record (ARN or ID)
    - name: tag-resource
      description: Tag a resource with key-value pairs
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: ""
        --tags=!: ""
    - name: untag-resource
      description: Remove tags from a resource by key
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: ""
        --tag-keys=!:
            nargs: -1
    - name: update-registry
      description: Updates an existing registry.
      flags:
        --approval-configuration=: The updated approval configuration.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: The updated description of the registry
        --discovery-configuration=: The updated discovery configuration.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=: The updated name of the registry
        --registry-id=!: The identifier of the registry to update (ARN or ID)
    - name: update-registry-record
      description: Updates a registry record.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: The updated description of the registry record.
        --descriptors=: The updated typed descriptor content for the registry record.
        --display-name=: The updated display name of the registry record.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=: The updated name of the registry record.
        --no-trigger-synchronization: Whether to trigger synchronization of the record's descriptor content from its source
        --record-id=!: The identifier of the registry record to update (ARN or ID)
        --record-type=: The updated type of the registry record.
        --record-version=: The updated version of the registry record.
        --registry-id=!: The identifier of the registry containing the record (ARN or ID)
        --trigger-synchronization: Whether to trigger synchronization of the record's descriptor content from its source
      completion:
        flag:
            record-type:
                - MCP
                - AGENT
                - CUSTOM
                - SKILL
    - name: update-registry-record-status
      description: Updates the status of a registry record as part of the registry's curation workflow, for example to approve or reject a record that is pending approval, or to deprecate an approved record so that it is no longer discoverable
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --record-id=!: The identifier of the registry record to update the status of (ARN or ID)
        --registry-id=!: The identifier of the registry containing the record (ARN or ID)
        --status-reason=!: The reason for the status change, for example why the record was approved, rejected, or deprecated
        --status=!: The target status for the registry record
      completion:
        flag:
            status:
                - DRAFT
                - PENDING_APPROVAL
                - APPROVED
                - REJECTED
                - DEPRECATED
                - CREATING
                - UPDATING
                - CREATE_FAILED
                - UPDATE_FAILED
    - name: wait
      description: Wait  until  a particular condition is satisfied.
      commands:
        - name: registry-ready
          description: Gets a registry by identifier (ARN or ID)
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
            --registry-id=!: The identifier of the registry to retrieve (ARN or ID)
        - name: registry-record-approved
          description: Retrieves the details of a registry record
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
            --record-id=!: The identifier of the registry record to retrieve (ARN or ID)
            --registry-id=!: The identifier of the registry containing the record (ARN or ID)
