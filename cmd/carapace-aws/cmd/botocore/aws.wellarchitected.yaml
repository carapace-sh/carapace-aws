# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: wellarchitected
description: AWS Well-Architected Tool
commands:
    - name: associate-lenses
      description: Associate a lens to a workload.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --lens-aliases=!:
            nargs: -1
        --workload-id=!: ""
    - name: associate-profiles
      description: Associate a profile with a workload.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --profile-arns=!:
            description: The list of profile ARNs to associate with the workload.
            nargs: -1
        --workload-id=!: ""
    - name: create-agent-context
      description: Creates a context associated with an optimization profile.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --content=!: The typed content of the context.
        --context-type=!: The type of the context.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --profile-arn=!: The Amazon Resource Name (ARN) of the profile to associate the context with.
        --title=!: The title of the context.
      completion:
        flag:
            context-type:
                - APPLICATION
    - name: create-agent-goal
      description: Creates an optimization goal associated with a profile.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --description=: A description of the goal.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --pillars=!:
            description: The Well-Architected Tool Framework pillars to associate with this goal.
            nargs: -1
        --profile-arn=!: The Amazon Resource Name (ARN) of the profile to associate the goal with.
        --title=!: The title of the goal.
    - name: create-agent-profile
      description: Creates an optimization profile that defines the scope and configuration for generating recommendations.
      flags:
        --aggregation-configuration=!:
            description: The aggregation configuration that defines which Amazon Web Services accounts and Regions to analyze.
            nargs: -1
        --business-overview=: The business overview for this profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --deletion-protection: Indicates whether deletion protection is enabled for the profile.
        --description=: A description of the profile.
        --display-name=: The display name of the profile shown to users.
        --execution-role-arn=!: The ARN of the IAM execution role used for recommendation actions.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The system name of the profile.
        --no-deletion-protection: Indicates whether deletion protection is enabled for the profile.
        --pillars=!:
            description: The Well-Architected Tool Framework pillars to associate with this profile.
            nargs: -1
        --tags=:
            description: The tags to associate with the profile.
            nargs: -1
    - name: create-lens-share
      description: Create a lens share.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --lens-alias=!: ""
        --shared-with=!: ""
    - name: create-lens-version
      description: Create a new lens version.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --is-major-version: Set to true if this new major lens version.
        --lens-alias=!: ""
        --lens-version=!: The version of the lens being created.
        --no-is-major-version: Set to true if this new major lens version.
    - name: create-milestone
      description: Create a milestone for an existing workload.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --milestone-name=!: ""
        --workload-id=!: ""
    - name: create-profile
      description: Create a profile.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --profile-description=!: The profile description.
        --profile-name=!: Name of the profile.
        --profile-questions=!:
            description: The profile questions.
            nargs: -1
        --tags=: The tags assigned to the profile.
    - name: create-profile-share
      description: Create a profile share.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --profile-arn=!: The profile ARN.
        --shared-with=!: ""
    - name: create-review-template
      description: Create a review template.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --description=!: The review template description.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --lenses=!:
            description: Lenses applied to the review template.
            nargs: -1
        --notes=: ""
        --tags=: The tags assigned to the review template.
        --template-name=!: Name of the review template.
    - name: create-template-share
      description: Create a review template share.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --shared-with=!: ""
        --template-arn=!: The review template ARN.
    - name: create-workload
      description: Create a new workload.
      flags:
        --account-ids=:
            nargs: -1
        --applications=:
            description: List of AppRegistry application ARNs associated to the workload.
            nargs: -1
        --architectural-design=: ""
        --aws-regions=:
            nargs: -1
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --description=!: ""
        --discovery-config=: Well-Architected discovery configuration settings associated to the workload.
        --environment=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --industry-type=: ""
        --industry=: ""
        --jira-configuration=: Jira configuration settings when creating a workload.
        --lenses=!:
            nargs: -1
        --non-aws-regions=:
            nargs: -1
        --notes=: ""
        --pillar-priorities=:
            nargs: -1
        --profile-arns=:
            description: The list of profile ARNs associated with the workload.
            nargs: -1
        --review-owner=: ""
        --review-template-arns=:
            description: The list of review template ARNs to associate with the workload.
            nargs: -1
        --tags=: The tags to be associated with the workload.
        --workload-name=!: ""
      completion:
        flag:
            environment:
                - PRODUCTION
                - PREPRODUCTION
    - name: create-workload-share
      description: Create a workload share.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --permission-type=!: ""
        --shared-with=!: ""
        --workload-id=!: ""
      completion:
        flag:
            permission-type:
                - READONLY
                - CONTRIBUTOR
    - name: delete-agent-context
      description: Deletes a context associated with a profile.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The unique identifier of the context to delete.
        --profile-arn=!: The Amazon Resource Name (ARN) of the profile containing the context.
    - name: delete-agent-goal
      description: Deletes an optimization goal from a profile.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The unique identifier of the goal to delete.
        --profile-arn=!: The Amazon Resource Name (ARN) of the profile containing the goal.
    - name: delete-agent-profile
      description: Deletes an optimization profile and its associated configuration.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --profile-arn=!: The Amazon Resource Name (ARN) of the profile to delete.
    - name: delete-lens
      description: Delete an existing lens.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --lens-alias=!: ""
        --lens-status=!: The status of the lens to be deleted.
      completion:
        flag:
            lens-status:
                - ALL
                - DRAFT
                - PUBLISHED
    - name: delete-lens-share
      description: Delete a lens share.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --lens-alias=!: ""
        --share-id=!: ""
    - name: delete-profile
      description: Delete a profile.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --profile-arn=!: The profile ARN.
    - name: delete-profile-share
      description: Delete a profile share.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --profile-arn=!: The profile ARN.
        --share-id=!: ""
    - name: delete-review-template
      description: Delete a review template.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --template-arn=!: The review template ARN.
    - name: delete-template-share
      description: Delete a review template share.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --share-id=!: ""
        --template-arn=!: The review template ARN.
    - name: delete-workload
      description: Delete an existing workload.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --workload-id=!: ""
    - name: delete-workload-share
      description: Delete a workload share.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-request-token=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --share-id=!: ""
        --workload-id=!: ""
    - name: disassociate-lenses
      description: Disassociate a lens from a workload.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --lens-aliases=!:
            nargs: -1
        --workload-id=!: ""
    - name: disassociate-profiles
      description: Disassociate a profile from a workload.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --profile-arns=!:
            description: The list of profile ARNs to disassociate from the workload.
            nargs: -1
        --workload-id=!: ""
    - name: export-lens
      description: Export an existing lens.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --lens-alias=!: ""
        --lens-version=: The lens version to be exported.
    - name: get-agent-context
      description: Retrieves detailed information about a specific context associated with a profile.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The unique identifier of the context to retrieve.
        --profile-arn=!: The Amazon Resource Name (ARN) of the profile containing the context.
    - name: get-agent-goal
      description: Retrieves detailed information about a specific optimization goal.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The unique identifier of the goal to retrieve.
        --profile-arn=!: The Amazon Resource Name (ARN) of the profile containing the goal.
    - name: get-agent-profile
      description: Retrieves detailed information about an optimization profile, including its configuration and metadata.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --profile-arn=!: The Amazon Resource Name (ARN) of the optimization profile to retrieve.
    - name: get-agent-recommendation
      description: Retrieves detailed information about a specific optimization recommendation, including its impact analysis, content, and implementation guidance.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --recommendation-arn=!: The Amazon Resource Name (ARN) of the recommendation to retrieve.
        --remediation-type=: Optional filter on remediation type.
      completion:
        flag:
            remediation-type:
                - AUTO_REMEDIATION
                - CONSOLE
                - CLI
                - SDK
                - IAC
                - MCP
    - name: get-agent-recommendation-generation
      description: Retrieves information about a recommendation generation process, including its status, progress, and results.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --generation-id=!: The unique identifier of the recommendation generation to retrieve.
        --profile-arn=!: The ARN of the optimization profile associated with this generation.
    - name: get-answer
      description: Get the answer to a specific question in a workload review.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --lens-alias=!: ""
        --milestone-number=: ""
        --question-id=!: ""
        --workload-id=!: ""
    - name: get-consolidated-report
      description: Get a consolidated report of your workloads.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --format=!: The format of the consolidated report.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --include-shared-resources: Set to `true` to have shared resources included in the report.
        --max-results=: The maximum number of results to return for this request.
        --next-token=: ""
        --no-include-shared-resources: Set to `true` to have shared resources included in the report.
      completion:
        flag:
            format:
                - PDF
                - JSON
    - name: get-global-settings
      description: Global settings for all workloads.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
