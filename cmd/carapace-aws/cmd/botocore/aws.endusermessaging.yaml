# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: endusermessaging
description: AWS End User Messaging
commands:
    - name: create-brand-profile
      description: Creates a brand profile.
      flags:
        --brand-profile-name=!: The name of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --deletion-protection-enabled: Specifies whether deletion protection is enabled.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --no-deletion-protection-enabled: Specifies whether deletion protection is enabled.
        --tags=:
            description: An array of key and value pair tags that are associated with the resource.
            nargs: -1
    - name: create-brand-profile-attributes
      description: Creates up to 10 attributes for a brand profile in a single request.
      flags:
        --attributes=!:
            description: The brand profile attributes.
            nargs: -1
        --brand-profile-id=!: The unique identifier of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: create-brand-profile-from-registration
      description: Creates a brand profile and populates its attributes from an existing registration.
      flags:
        --brand-profile-name=!: The name of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --no-smart-match: Specifies whether to use semantic field mapping between brand profile attributes and registration fields.
        --registration-id=!: The identifier or Amazon Resource Name (ARN) of the registration to populate the brand profile from.
        --smart-match: Specifies whether to use semantic field mapping between brand profile attributes and registration fields.
        --tags=:
            description: An array of key and value pair tags that are associated with the resource.
            nargs: -1
    - name: create-notify-code-configuration
      description: Creates a notify code configuration.
      flags:
        --channel-parameters=: The channel-specific parameters used to render and deliver the one-time passcode.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --code-configuration-parameters=: The passcode policy parameters, including the code type, length, validity period, and maximum number of attempts.
        --deletion-protection-enabled: Specifies whether deletion protection is enabled.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --no-deletion-protection-enabled: Specifies whether deletion protection is enabled.
        --notify-code-configuration-name=!: The name of the notify code configuration.
        --tags=:
            description: An array of key and value pair tags that are associated with the resource.
            nargs: -1
    - name: create-registrations-from-brand-profile
      description: Creates one or more registrations in the DRAFT state and prefills their fields from the attributes of a brand profile.
      flags:
        --brand-profile-id=!: The unique identifier of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --no-smart-match: Specifies whether to use semantic field mapping between brand profile attributes and registration fields.
        --registration-types=!:
            description: The registration types to create, for example US\_TOLL\_FREE\_REGISTRATION or SENDER\_ID.
            nargs: -1
        --smart-match: Specifies whether to use semantic field mapping between brand profile attributes and registration fields.
    - name: delete-brand-profile
      description: Deletes a brand profile.
      flags:
        --brand-profile-id=!: The unique identifier of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-brand-profile-attribute
      description: Deletes a brand profile attribute.
      flags:
        --attribute-name=!: The name of the brand profile attribute.
        --brand-profile-id=!: The unique identifier of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-notify-code-configuration
      description: Deletes a notify code configuration.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --notify-code-configuration-id=!: The unique identifier of the notify code configuration.
    - name: get-brand-profile
      description: Retrieves the metadata for a brand profile, including its name, status, deletion protection setting, and timestamps.
      flags:
        --brand-profile-id=!: The unique identifier of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: get-brand-profile-attribute
      description: Retrieves a single brand profile attribute.
      flags:
        --attribute-name=!: The name of the brand profile attribute.
        --brand-profile-id=!: The unique identifier of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: get-job
      description: Retrieves the current state of an asynchronous job, including its status and any resources that it created or updated.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --job-id=!: The unique identifier of the asynchronous job.
    - name: get-notify-code-configuration
      description: Retrieves a notify code configuration.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --notify-code-configuration-id=!: The unique identifier of the notify code configuration.
    - name: list-brand-profile-attributes
      description: Retrieves a paginated list of the attributes for a brand profile.
      flags:
        --brand-profile-id=!: The unique identifier of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return per page.
        --next-token=: The token to retrieve the next page of results.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-brand-profiles
      description: Retrieves a paginated list of the brand profiles in your account.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return per page.
        --next-token=: The token to retrieve the next page of results.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-jobs
      description: Retrieves a paginated list of the asynchronous jobs in your account.
      flags:
        --brand-profile-id=: Filters the results to jobs for the specified brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return per page.
        --next-token=: The token to retrieve the next page of results.
        --operation-type=: Filters the results to jobs of the specified operation type.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
        --status=: Filters the results to jobs that have the specified status.
      completion:
        flag:
            status:
                - SUCCESS
                - PROCESSING
                - FAILED
    - name: list-notify-code-configurations
      description: Retrieves a paginated list of the notify code configurations in your account.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return per page.
        --next-token=: The token to retrieve the next page of results.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-registrations-from-brand-profile
      description: Retrieves a paginated list of the registrations that were created from a brand profile through the synchronization operations.
      flags:
        --brand-profile-id=!: The unique identifier of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return per page.
        --next-token=: The token to retrieve the next page of results.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-tags-for-resource
      description: Retrieves the tags that are associated with a resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    - name: send-notify-code-verification
      description: Generates a one-time passcode and delivers it to a recipient over the requested channel.
      flags:
        --channel=!: The channel used to deliver the one-time passcode to the recipient.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --configuration-set-name=: The name of the configuration set used to control how delivery events for the message are handled.
        --context=: A map of custom key and value pairs that are propagated to the delivery events for this verification.
        --destination-identity=!: The recipient identifier.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --notify-code-configuration=: The identifier or Amazon Resource Name (ARN) of the notify code configuration that supplies the passcode policy and template defaults.
        --origination-identity=!: The identity used to send the message, such as a phone number, sender ID, or pool that is owned by your account.
        --override-channel-parameters=: The channel-specific parameters used to render and deliver the one-time passcode for this request.
        --override-code-configuration-parameters=: The per-send overrides for the passcode policy parameters, including the code type, length, validity period, and maximum number of attempts.
        --reference-id=: A caller-supplied reference identifier that binds a send request to a later validate request.
      completion:
        flag:
            channel:
                - TEXT
                - VOICE
                - WHATSAPP
    - name: tag-resource
      description: Adds or overwrites the tags on a resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
        --tags=!:
            description: An array of key and value pair tags that are associated with the resource.
            nargs: -1
    - name: untag-resource
      description: Removes the specified tags from a resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
        --tag-keys=!:
            description: The list of tag keys to remove from the resource.
            nargs: -1
    - name: update-brand-profile
      description: Updates the name or the deletion protection setting of a brand profile.
      flags:
        --brand-profile-id=!: The unique identifier of the brand profile.
        --brand-profile-name=: The name of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --deletion-protection-enabled: Specifies whether deletion protection is enabled.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --no-deletion-protection-enabled: Specifies whether deletion protection is enabled.
    - name: update-brand-profile-attribute
      description: Updates the value, description, or category of an existing brand profile attribute.
      flags:
        --attachment-body=: The binary content for an attribute of type IMAGE or DOCUMENT.
        --attribute-name=!: The name of the brand profile attribute.
        --attribute-value=: The text value of the attribute.
        --brand-profile-id=!: The unique identifier of the brand profile.
        --category=: The category of the attribute.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: A description of the attribute.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: update-brand-profile-from-registration
      description: Imports or refreshes the attributes of an existing brand profile from an existing registration.
      flags:
        --brand-profile-id=!: The unique identifier of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --no-smart-match: Specifies whether to use semantic field mapping between brand profile attributes and registration fields.
        --on-attribute-conflict=: Specifies how the service resolves an attribute that already exists.
        --registration-id=!: The identifier or Amazon Resource Name (ARN) of the registration to import attributes from.
        --smart-match: Specifies whether to use semantic field mapping between brand profile attributes and registration fields.
      completion:
        flag:
            on-attribute-conflict:
                - REPLACE
                - PRESERVE
    - name: update-notify-code-configuration
      description: Updates the mutable fields of a notify code configuration.
      flags:
        --channel-parameters=: The updated channel-specific parameters used to render and deliver the one-time passcode.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --code-configuration-parameters=: The updated passcode policy parameters, including the code type, length, validity period, and maximum number of attempts.
        --deletion-protection-enabled: Specifies whether deletion protection is enabled.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --no-deletion-protection-enabled: Specifies whether deletion protection is enabled.
        --notify-code-configuration-id=!: The unique identifier of the notify code configuration.
        --notify-code-configuration-name=: The name of the notify code configuration.
    - name: update-registrations-from-brand-profile
      description: Repushes the attributes of a brand profile into existing DRAFT registrations.
      flags:
        --brand-profile-id=!: The unique identifier of the brand profile.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --no-smart-match: Specifies whether to use semantic field mapping between brand profile attributes and registration fields.
        --on-attribute-conflict=: Specifies how the service resolves an attribute that already exists.
        --registration-ids=!:
            description: The identifiers of the registrations.
            nargs: -1
        --smart-match: Specifies whether to use semantic field mapping between brand profile attributes and registration fields.
      completion:
        flag:
            on-attribute-conflict:
                - REPLACE
                - PRESERVE
    - name: validate-notify-code-verification
      description: Validates a one-time passcode that a recipient submitted.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --code=!: The one-time passcode that the recipient submitted for validation.
        --destination-identity=!: The recipient identifier.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --reference-id=: The caller-supplied reference identifier used to locate the verification.
    - name: wait
      description: Wait  until  a particular condition is satisfied.
      commands:
        - name: brand-profile-active
          description: Retrieves the metadata for a brand profile, including its name, status, deletion protection setting, and timestamps.
          flags:
            --brand-profile-id=!: The unique identifier of the brand profile.
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        - name: job-success
          description: Retrieves the current state of an asynchronous job, including its status and any resources that it created or updated.
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
            --job-id=!: The unique identifier of the asynchronous job.
