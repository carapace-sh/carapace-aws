# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: apiportal
description: APIPortal
commands:
    - name: associate-managed-apis
      description: Associate one or more Managed APIs with a product.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --managed-api-ids=!:
            nargs: -1
        --product-id=!: The identifier of the product to associate the Managed APIs with.
    - name: create-managed-api
      description: Promote a discovered API in the API inventory into the managed API list.
      flags:
        --api-signature=!: The resource, method, host, port, and path that identify the API.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: ""
    - name: create-portal
      description: Creates a portal that publishes documentation for the products it includes.
      flags:
        --authorization=!: How readers sign in to the portal, and whether fine-grained access control is on.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --endpoint-configuration=!: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --included-product-arns=:
            description: The ARNs of the products the portal includes, up to 200.
            nargs: -1
        --logo-uri=: The S3 location of the portal logo, in the form `s3://bucket/key`.
        --portal-content=!: The portal's display name, description, and theme.
        --rum-app-monitor-name=: The name of the CloudWatch RUM app monitor that collects reader telemetry for the portal.
        --tags=: ""
    - name: create-portal-preview
      description: Starts building a preview of the portal's current content.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --portal-id=!: The identifier of the portal.
    - name: create-product
      description: Creates a product.
      flags:
        --api-selection-configuration=: How Managed APIs are selected for the product.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: A description of the product, up to 1024 characters.
        --display-name=!: The name of the product, from 1 to 255 characters.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: ""
    - name: create-product-api-page
      description: Creates an API page that documents a Managed API in a product.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --display-content=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --managed-api-id=!: The Managed API this page documents.
        --product-id=!: The identifier of the product.
        --tags=: ""
        --try-it-state=: Whether readers can call the API from the page with Try-It.
      completion:
        flag:
            try-it-state:
                - ENABLED
                - DISABLED
    - name: create-product-page
      description: Creates a product page with free-form documentation.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --display-content=!: The title and body of the page.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --product-id=!: The identifier of the product.
        --tags=: ""
    - name: delete-discovery-configuration
      description: Deletes the discovery configuration and stops any running discovery.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-managed-api
      description: Deletes a Managed API.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --managed-api-id=!: The identifier of the Managed API.
    - name: delete-organization-discovery-configuration
      description: Deletes the organization-wide discovery configuration and stops any running discovery across the organization.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-portal
      description: Deletes a portal.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --portal-id=!: The identifier of the portal.
    - name: delete-product
      description: Deletes a product.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --product-id=!: The identifier of the product.
    - name: delete-product-api-page
      description: Deletes an API page.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --product-api-page-id=!: The identifier of the API page.
        --product-id=!: The identifier of the product.
    - name: delete-product-page
      description: Deletes a product page.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --product-id=!: The identifier of the product.
        --product-page-id=!: The identifier of the product page.
    - name: delete-product-sharing-policy
      description: Deletes the sharing policy of a product.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --product-id=!: The identifier of the product.
    - name: disassociate-managed-apis
      description: Disassociate one or more Managed APIs from a product.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --managed-api-ids=!:
            nargs: -1
        --product-id=!: The identifier of the product to disassociate the Managed APIs from.
    - name: get-api-inventory-item
      description: Gets full details of a single API inventory item.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --host=!: ""
        --method=!: The HTTP method of the API.
        --path=!: The request path of the API.
        --port=!: The port the API listens on, from 0 to 65535.
        --resource-arn=!: The ARN of the resource that serves the API, such as an API Gateway stage or a load balancer.
      completion:
        flag:
            method:
                - GET
                - POST
                - PUT
                - DELETE
                - PATCH
                - ANY
                - HEAD
                - OPTIONS
    - name: get-discovery-configuration
      description: Retrieves the discovery configuration for the account and region.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: get-managed-api
      description: Returns a Managed API, including its security posture findings.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --managed-api-id=!: The identifier of the Managed API.
    - name: get-organization-discovery-configuration
      description: Retrieves the organization-wide discovery configuration.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: get-portal
      description: Returns the configuration, publish status, and preview status of a portal.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --portal-id=!: The identifier of the portal.
    - name: get-product
      description: Returns a product.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --product-id=!: The identifier of the product.
        --resource-owner-account-id=: The AWS account ID that owns the product.
    - name: get-product-api-page
      description: Returns an API page, including its body.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --include-raw-display-content: Set to `true` to also return the page body in `rawDisplayContent`.
        --no-include-raw-display-content: Set to `true` to also return the page body in `rawDisplayContent`.
        --product-api-page-id=!: The identifier of the API page.
        --product-id=!: The identifier of the product.
        --resource-owner-account-id=: The AWS account ID that owns the product.
    - name: get-product-page
      description: Returns a product page, including its body.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --product-id=!: The identifier of the product.
        --product-page-id=!: The identifier of the product page.
        --resource-owner-account-id=: The AWS account ID that owns the product.
    - name: get-product-sharing-policy
      description: Returns the sharing policy of a product.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --product-id=!: The identifier of the product.
    - name: list-api-inventory-items
      description: Lists discovered API inventory items with filtering and pagination.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --filters=: Filters that limit the results.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return in one page, from 1 to 100.
        --next-token=: The pagination token returned by a previous call.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-discovery-statuses
      description: Lists discovery statuses for services.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --discovery-source=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return in one page, from 1 to 100.
        --next-token=: The pagination token returned by a previous call.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
      completion:
        flag:
            discovery-source:
                - API_GATEWAY
                - ELB
                - CLOUDFRONT
    - name: list-managed-api-events
      description: Lists API-security events for a single managed API, most recent first.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --managed-api-id=!: The identifier of the Managed API.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return in one page, from 1 to 20.
        --next-token=: The pagination token returned by a previous call.
        --page-size=: The size of each page to get in the AWS service call.
        --started-after=: Inclusive lower bound on each event's start time; only events that started at or after this time are returned.
        --started-before=: Exclusive upper bound on each event's start time; only events that started before this time are returned.
        --starting-token=: A token to specify where to start paginating.
    - name: list-managed-apis
      description: Lists the Managed APIs in your account.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return in one page, from 1 to 100.
        --next-token=: The pagination token returned by a previous call.
        --page-size=: The size of each page to get in the AWS service call.
        --product-id=: 'Optional filter: when supplied, only Managed APIs associated with this product are returned.'
        --starting-token=: A token to specify where to start paginating.
    - name: list-portals
      description: Lists the portals in your account.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return in one page, from 1 to 100.
        --next-token=: The pagination token returned by a previous call.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-product-api-pages
      description: Lists the API pages in a product.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return in one page, from 1 to 100.
        --next-token=: The pagination token returned by a previous call.
        --page-size=: The size of each page to get in the AWS service call.
        --product-id=!: The identifier of the product.
        --resource-owner-account-id=: The AWS account ID that owns the product.
        --starting-token=: A token to specify where to start paginating.
    - name: list-product-pages
      description: Lists the product pages in a product.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return in one page, from 1 to 100.
        --next-token=: The pagination token returned by a previous call.
        --page-size=: The size of each page to get in the AWS service call.
        --product-id=!: The identifier of the product.
        --resource-owner-account-id=: The AWS account ID that owns the product.
        --starting-token=: A token to specify where to start paginating.
    - name: list-products
      description: Lists products you own, products shared with you, or both.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --managed-api-id=: 'Optional filter: when supplied, only Products this Managed API is associated with are returned.'
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return in one page, from 1 to 100.
        --next-token=: The pagination token returned by a previous call.
        --page-size=: The size of each page to get in the AWS service call.
        --resource-owner=: 'Whose products to return: `SELF` for your own, `OTHER_ACCOUNTS` for products shared with you, or `ALL`.'
        --starting-token=: A token to specify where to start paginating.
      completion:
        flag:
            resource-owner:
                - ALL
                - SELF
                - OTHER_ACCOUNTS
    - name: list-tags-for-resource
      description: Lists the tags for an API Portal resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The ARN of the resource.
    - name: put-discovery-configuration
      description: Creates or updates the discovery configuration
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --discovery-sources=:
            description: The sources to discover APIs from.
            nargs: -1
        --excluded-resources=:
            description: The ARNs of resources to leave out of discovery, up to 50.
            nargs: -1
        --features=:
            description: Optional capabilities to enable.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: ""
    - name: put-organization-discovery-configuration
      description: Creates or updates the organization-wide discovery configuration.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --discovery-filters=: The accounts or organizational units to include in or exclude from discovery.
        --discovery-sources=:
            description: The sources to discover APIs from.
            nargs: -1
        --exclusion-filters=: Exclusion filters for organization-scoped discovery.
        --features=:
            description: Optional capabilities to enable.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: ""
    - name: put-product-sharing-policy
      description: Creates or replaces the sharing policy of a product.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --policy-document=!: The sharing policy as a JSON resource policy document.
        --product-id=!: The identifier of the product.
        --tags=: ""
    - name: start-discovery
      description: Starts the API discovery process.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: Identifier of the discovery configuration to start.
    - name: stop-discovery
      description: Stops the running API discovery process.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: Identifier of the discovery configuration to stop.
    - name: tag-resource
      description: Adds or updates tags on an API Portal resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The ARN of the resource.
        --tags=!: ""
    - name: untag-resource
      description: Removes tags from an API Portal resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The ARN of the resource.
        --tag-keys=!:
            description: The keys of the tags to remove, up to 50.
            nargs: -1
    - name: update-portal
      description: Updates a portal.
      flags:
        --authorization=: The new authorization settings.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --endpoint-configuration=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --included-product-arns=:
            description: The new list of product ARNs, up to 200. It replaces the current list.
            nargs: -1
        --logo-uri=: The new S3 location of the portal logo, in the form `s3://bucket/key`.
        --portal-content=: The new display name, description, and theme.
        --portal-id=!: The identifier of the portal.
        --rum-app-monitor-name=: The new CloudWatch RUM app monitor name.
    - name: update-portal-publish-status
      description: Publishes or disables a portal.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: A description of this publish request, up to 1024 characters.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --portal-id=!: The identifier of the portal.
        --status=!: ""
      completion:
        flag:
            status:
                - PUBLISHED
                - DISABLED
    - name: update-product
      description: Updates a product.
      flags:
        --api-selection-configuration=: The new API selection settings.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: The new description of the product.
        --display-name=: The new name of the product.
        --display-order=: The new page order.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --product-id=!: The identifier of the product.
    - name: update-product-api-page
      description: Updates an API page.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --display-content=: ""
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --product-api-page-id=!: The identifier of the API page.
        --product-id=!: The identifier of the product.
        --try-it-state=: The new Try-It setting.
      completion:
        flag:
            try-it-state:
                - ENABLED
                - DISABLED
    - name: update-product-page
      description: Updates a product page.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --display-content=: The new title and body of the page.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --product-id=!: The identifier of the product.
        --product-page-id=!: The identifier of the product page.
