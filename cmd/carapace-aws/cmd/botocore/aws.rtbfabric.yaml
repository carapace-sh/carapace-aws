# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: rtbfabric
description: RTBFabric
commands:
    - name: accept-link
      description: Accepts a link request between gateways.
      flags:
        --attributes=: Attributes of the link.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
        --log-settings=!: Settings for the application logs.
        --timeout-in-millis=: The timeout value in milliseconds.
    - name: associate-certificate
      description: Associates an ACM certificate with a responder gateway.
      flags:
        --acm-certificate-arn=!: The Amazon Resource Name (ARN) of the ACM certificate to associate.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=!: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: create-inbound-external-link
      description: Creates an inbound external link.
      flags:
        --attributes=: Attributes of the link.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=!: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --log-settings=!: Settings for the application logs.
        --tags=: A map of the key-value pairs of the tag or tags to assign to the resource.
    - name: create-link
      description: Creates a new link between gateways.
      flags:
        --attributes=: Attributes of the link.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --http-responder-allowed: Boolean to specify if an HTTP responder is allowed.
        --log-settings=!: Application log settings for the link.
        --no-http-responder-allowed: Boolean to specify if an HTTP responder is allowed.
        --peer-gateway-id=!: The unique identifier of the peer gateway.
        --tags=: A map of the key-value pairs of the tag or tags to assign to the resource.
        --timeout-in-millis=: The timeout value in milliseconds.
    - name: create-link-routing-rule
      description: Creates a routing rule for a link.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=!: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --conditions=!: The conditions for the routing rule.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
        --priority=!: The priority of the routing rule.
        --tags=: A map of the key-value pairs of the tag or tags to assign to the resource.
    - name: create-outbound-external-link
      description: Creates an outbound external link.
      flags:
        --attributes=: Attributes of the link.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=!: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --log-settings=!: Settings for the application logs.
        --public-endpoint=!: The public endpoint of the link.
        --tags=: A map of the key-value pairs of the tag or tags to assign to the resource.
    - name: create-requester-gateway
      description: Creates a requester gateway.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=!: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --description=: An optional description for the requester gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --security-group-ids=!:
            description: The unique identifiers of the security groups.
            nargs: -1
        --subnet-ids=!:
            description: The unique identifiers of the subnets.
            nargs: -1
        --tags=: A map of the key-value pairs of the tag or tags to assign to the resource.
        --vpc-id=!: The unique identifier of the Virtual Private Cloud (VPC).
    - name: create-responder-gateway
      description: Creates a responder gateway.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-routing-policy=: The client routing policy of the gateway.
        --client-token=!: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --description=: An optional description for the responder gateway.
        --domain-name=: The domain name for the responder gateway.
        --gateway-type=: The type of gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --listener-config=: ""
        --managed-endpoint-configuration=: The configuration for the managed endpoint.
        --port=!: The networking port to use.
        --protocol=!: The networking protocol to use.
        --security-group-ids=!:
            description: The unique identifiers of the security groups.
            nargs: -1
        --subnet-ids=!:
            description: Unique identifiers of the subnets.
            nargs: -1
        --tags=: A map of the key-value pairs of the tag or tags to assign to the resource.
        --trust-store-configuration=: The configuration of the trust store.
        --vpc-id=!: The unique identifier of the Virtual Private Cloud (VPC).
      completion:
        flag:
            client-routing-policy:
                - AVAILABILITY_ZONE_AFFINITY
                - ANY_AVAILABILITY_ZONE
            gateway-type:
                - EXTERNAL
                - INTERNAL
            protocol:
                - HTTP
                - HTTPS
    - name: delete-inbound-external-link
      description: Deletes an inbound external link.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
    - name: delete-link
      description: Deletes a link between gateways.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
    - name: delete-link-routing-rule
      description: Deletes a routing rule from a link.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
        --rule-id=!: The unique identifier of the routing rule.
    - name: delete-outbound-external-link
      description: Deletes an outbound external link.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
    - name: delete-requester-gateway
      description: Deletes a requester gateway.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: delete-responder-gateway
      description: Deletes a responder gateway.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: disassociate-certificate
      description: Removes a certificate association from a responder gateway.
      flags:
        --acm-certificate-arn=!: The Amazon Resource Name (ARN) of the ACM certificate to disassociate.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: get-available-module
      description: Returns a module that you can attach.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --module-id=!: The module's ID.
    - name: get-available-module-version
      description: Returns an ACTIVE or DEPRECATED version of a module that you can attach.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --module-id=!: The module's ID.
        --version=!: The version.
    - name: get-certificate-association
      description: Retrieves the details of a certificate association with a responder gateway.
      flags:
        --acm-certificate-arn=!: The Amazon Resource Name (ARN) of the ACM certificate.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: get-inbound-external-link
      description: Retrieves information about an inbound external link.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
    - name: get-link
      description: Retrieves information about a link between gateways.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
    - name: get-link-routing-rule
      description: Retrieves the details of a routing rule for a link.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
        --rule-id=!: The unique identifier of the routing rule.
    - name: get-outbound-external-link
      description: Retrieves information about an outbound external link.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
    - name: get-requester-gateway
      description: Retrieves information about a requester gateway.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: get-responder-gateway
      description: Retrieves information about a responder gateway.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: get-update
      description: Returns ResourceNotFoundException for an updateId past the 90-day retention window, indistinguishable in the response from an id that never existed.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --update-id=!: The unique identifier of the update.
    - name: list-available-module-versions
      description: Lists the ACTIVE and DEPRECATED versions of a module that you can attach, highest version first (numerically by MAJOR, then MINOR, then PATCH).
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results for each page, from 1 to 10. The default is 10.
        --module-id=!: The module's ID.
        --next-token=: If nextToken is returned, there are more results available.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
        --status=: Lists only versions in this status.
      completion:
        flag:
            status:
                - CREATING
                - CREATE_FAILED
                - ACTIVE
                - DEPRECATED
    - name: list-available-modules
      description: Lists the modules that you can attach, newest first by `createdAt`.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results for each page, from 1 to 10. The default is 10.
        --next-token=: If nextToken is returned, there are more results available.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
        --subscription-type=: Lists only modules that you have access to this way.
      completion:
        flag:
            subscription-type:
                - MARKETPLACE
                - PRIVATE
                - AWS_BUILT_IN
    - name: list-certificate-associations
      description: Lists the certificate associations for a responder gateway.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results that are returned per call.
        --next-token=: If `nextToken` is returned, there are more results available.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-link-routing-rules
      description: Lists the routing rules for a link.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results that are returned per call.
        --next-token=: If `nextToken` is returned, there are more results available.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-links
      description: Lists links associated with gateways.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results that are returned per call.
        --next-token=: If `nextToken` is returned, there are more results available.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-requester-gateways
      description: Lists requester gateways.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results that are returned per call.
        --next-token=: If `nextToken` is returned, there are more results available.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-responder-gateways
      description: Lists reponder gateways.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results that are returned per call.
        --next-token=: If `nextToken` is returned, there are more results available.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: list-tags-for-resource
      description: Lists tags for a resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The Amazon Resource Name (ARN) of the resource for which you want to retrieve tags.
    - name: list-updates
      description: Lists the updates on a gateway.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=: The ID of a link on this gateway, to list only that link's updates.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of results to return for each call.
        --next-token=: If nextToken is returned, there are more results available.
        --page-size=: The size of each page to get in the AWS service call.
        --rule-id=: The ID of a routing rule, to list only that rule's updates.
        --starting-token=: A token to specify where to start paginating.
        --status=: Lists only updates in this status.
        --type=: Lists only updates of this type.
      completion:
        flag:
            status:
                - IN_PROGRESS
                - SUCCESSFUL
                - FAILED
            type:
                - GATEWAY_CONFIG_UPDATE
                - LINK_CONFIG_UPDATE
                - LINK_FLOW_UPDATE
                - ROUTING_RULE_UPDATE
    - name: put-link-flows
      description: Replaces a link's flow configuration.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure that the operation completes no more than one time.
        --flows=!:
            description: The link's flows, replacing the current ones.
            nargs: -1
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
        --lock-token=!: The concurrency token that you read from GetLink.
    - name: reject-link
      description: Rejects a link request between gateways.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
    - name: tag-resource
      description: Assigns one or more tags (key-value pairs) to the specified resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The Amazon Resource Name (ARN) of the resource that you want to tag.
        --tags=!: A map of the key-value pairs of the tag or tags to assign to the resource.
    - name: untag-resource
      description: Removes a tag or tags from a resource.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-arn=!: The Amazon Resource Name (ARN) of the resource that you want to untag.
        --tag-keys=!:
            description: The keys of the key-value pairs for the tag or tags you want to remove from the specified resource.
            nargs: -1
    - name: update-link
      description: Updates the configuration of a link between gateways.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier for the request.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
        --log-settings=: Settings for the application logs.
        --timeout-in-millis=: The timeout value in milliseconds.
    - name: update-link-module-flow
      description: Updates a link module flow.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=!: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
        --modules=!:
            description: The configuration of a module.
            nargs: -1
    - name: update-link-routing-rule
      description: Updates a routing rule for a link.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier for the request.
        --conditions=!: The updated conditions for the routing rule.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --link-id=!: The unique identifier of the link.
        --priority=!: The updated priority of the routing rule.
        --rule-id=!: The unique identifier of the routing rule.
    - name: update-requester-gateway
      description: Updates a requester gateway.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=!: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --description=: An optional description for the requester gateway.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    - name: update-responder-gateway
      description: Updates the description, Auto Scaling group managed endpoint configuration, trust store configuration, and client routing policy of a responder gateway.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-routing-policy=: The client routing policy of the gateway.
        --client-token=!: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --description=: An optional description for the responder gateway.
        --domain-name=: Domain name for the responder gateway.
        --gateway-id=!: The unique identifier of the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --listener-config=: The listener configuration for the responder gateway.
        --managed-endpoint-configuration=: The configuration for the managed endpoint.
        --port=!: Networking port to use.
        --protocol=!: Networking protocol to use.
        --trust-store-configuration=: The configuration of the trust store.
      completion:
        flag:
            client-routing-policy:
                - AVAILABILITY_ZONE_AFFINITY
                - ANY_AVAILABILITY_ZONE
            protocol:
                - HTTP
                - HTTPS
    - name: wait
