# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: lambda-core
description: AWS Lambda Core
commands:
    - name: create-network-connector
      description: Creates a network connector that enables Lambda compute resources to route outbound traffic through your Amazon VPC.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        --configuration=!: The network configuration for the connector.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: A unique name for the network connector within your account and Region.
        --operator-role=: The ARN of the IAM role that Lambda assumes to manage elastic network interfaces in your VPC.
        --tags=: A map of key-value pairs to associate with the network connector for organization, cost allocation, or access control.
    - name: create-runtime
      description: Creates a customer-managed runtime, a resource providing a centrally managed execution environment for your Lambda functions.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: A description of the runtime.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --license-info=: The license information for the runtime.
        --name=!: The name of the runtime to create.
        --release-lifecycle=: The runtime lifecycle for the runtime (optional).
        --tags=: A map of tag keys and values to associate with the runtime.
    - name: create-runtime-alias
      description: Creates a new customer-managed runtime alias.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: A description of the runtime alias.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name to assign to the new runtime alias.
        --release-lifecycle=: The runtime lifecycle for the alias.
        --runtime-name=!: The name or ARN of the runtime to create an alias for.
        --runtime-version=!: The name of the runtime version the alias points to.
    - name: create-runtime-version
      description: Creates a new runtime version.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --dry-run: When set to true, the request is validated without creating a new runtime version.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --image-uri=!: The URI of the container image used to define the function execution environment for this runtime version.
        --name=!: The name to assign to the new runtime version.
        --no-dry-run: When set to true, the request is validated without creating a new runtime version.
        --release-notes=: The release notes to associate with the runtime version.
        --runtime-name=!: The name or ARN of the runtime to create a version for.
    - name: delete-network-connector
      description: Initiates deletion of a network connector.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --identifier=!: The identifier of the network connector to delete.
    - name: delete-runtime
      description: Schedules a customer-managed runtime to be deleted.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --recovery-window-in-days=: Optional.
        --runtime-name=!: The name or ARN of the runtime to delete.
    - name: delete-runtime-alias
      description: Schedules a runtime alias to be deleted.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name of the runtime alias to delete.
        --recovery-window-in-days=: Optional.
        --runtime-name=!: The name or ARN of the runtime.
    - name: delete-runtime-version
      description: Schedules a runtime version to be deleted.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name of the runtime version to delete.
        --recovery-window-in-days=: Optional.
        --runtime-name=!: The name or ARN of the runtime.
    - name: get-network-connector
      description: Retrieves the current configuration, state, and metadata of a network connector.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --identifier=!: The identifier of the network connector to retrieve.
    - name: get-runtime
      description: Retrieves the configuration and metadata of a runtime.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --runtime-name=!: The name or ARN of the runtime to retrieve.
    - name: get-runtime-alias
      description: Retrieves the configuration, state, and metadata of a runtime alias.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name of the runtime alias to retrieve.
        --runtime-name=!: The name or ARN of the runtime.
    - name: get-runtime-version
      description: Retrieves the configuration, state, and metadata of a runtime version.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name of the runtime version to retrieve.
        --runtime-name=!: The name or ARN of the runtime.
    - name: list-network-connector-versions
      description: Returns a paginated list of the versions of a network connector.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --identifier=!: The identifier of the network connector whose versions you want to list.
        --marker=: The pagination token from a previous `ListNetworkConnectorVersions` response.
        --max-items=: The maximum number of versions to return per page.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
        --state=: Optional filter to return only versions in the specified state (for example, `ACTIVE` or `FAILED`).
      completion:
        flag:
            state:
                - PENDING
                - ACTIVE
                - INACTIVE
                - FAILED
                - DELETING
                - DELETE_FAILED
    - name: list-network-connectors
      description: Returns a paginated list of network connectors in your account for the current Region.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --marker=: The pagination token from a previous `ListNetworkConnectors` response.
        --max-items=: The maximum number of connectors to return per page.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
        --state=: Optional filter to return only connectors in the specified state (for example, `ACTIVE` or `FAILED`).
      completion:
        flag:
            state:
                - PENDING
                - ACTIVE
                - INACTIVE
                - FAILED
                - DELETING
                - DELETE_FAILED
    - name: list-runtime-aliases
      description: Returns a paginated list of aliases for the specified runtime.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of runtime aliases to return per page.
        --next-token=: The pagination token from a previous response.
        --page-size=: The size of each page to get in the AWS service call.
        --runtime-name=!: The name or ARN of the runtime whose aliases to list.
        --starting-token=: A token to specify where to start paginating.
    - name: list-runtime-versions
      description: Returns a paginated list of versions for the specified runtime.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of runtime versions to return per page.
        --next-token=: The pagination token from a previous response.
        --page-size=: The size of each page to get in the AWS service call.
        --runtime-name=!: The name or ARN of the runtime whose versions to list.
        --starting-token=: A token to specify where to start paginating.
    - name: list-runtimes
      description: Returns a paginated list of runtimes in your account for the current Region.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of runtimes to return per page.
        --next-token=: The pagination token from a previous response.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
    - name: restore-runtime
      description: Cancels a pending scheduled deletion, returning the resource to the ACTIVE state.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --runtime-alias=: Optional.
        --runtime-name=!: The name or ARN of the runtime to restore.
        --runtime-version=: Optional.
    - name: update-network-connector
      description: Updates the VPC configuration or operator role of an existing network connector.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier to ensure idempotency of the update request.
        --configuration=: The updated network configuration for the connector.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --identifier=!: The identifier of the network connector to update.
        --operator-role=: The updated ARN of the IAM role that Lambda assumes to manage ENIs.
    - name: update-runtime
      description: Updates the properties of an existing customer-managed runtime, such as its description, license information, or lifecycle information.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: The updated description of the runtime.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --license-info=: The updated license information for the runtime.
        --release-lifecycle=: The runtime lifecycle for the runtime.
        --runtime-name=!: The name or ARN of the runtime to update.
    - name: update-runtime-alias
      description: Updates an existing runtime alias to point to a different runtime version or to change its description or lifecycle information.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --description=: A description of the runtime alias.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name of the runtime alias to update.
        --release-lifecycle=: The lifecycle for the alias.
        --runtime-name=!: The name or ARN of the runtime.
        --runtime-version=!: The name of the runtime version the alias should point to.
    - name: update-runtime-version
      description: Updates the runtime version release notes.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: The name of the runtime version to update.
        --release-notes=!: The release notes to associate with the runtime version.
        --runtime-name=!: The name or ARN of the runtime.
    - name: wait
      description: Wait  until  a particular condition is satisfied.
      commands:
        - name: runtime-alias-active
          description: Retrieves the configuration, state, and metadata of a runtime alias.
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
            --name=!: The name of the runtime alias to retrieve.
            --runtime-name=!: The name or ARN of the runtime.
        - name: runtime-version-active
          description: Retrieves the configuration, state, and metadata of a runtime version.
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
            --name=!: The name of the runtime version to retrieve.
            --runtime-name=!: The name or ARN of the runtime.
